<script>
(function(){
 'use strict';

 let studyProfile=null,studyAnalysis=null,studyVerticalAdaptation={status:'not-evaluated'};
 let studyDynamicAdjustments=[],studyWordSourceNumbers=[],studyWindow=null,studyWindowRows=[],studyWindowGlobal=null;
 let generation=0,renderTimer=null,optical=null,opticalAnchor=null,opticalRaf=0,opticalOffset=0,opticalFrames=0;
 let osmdRenderedWidth=0,osmdRenderedHeight=0,opticalDisplayScale=1,opticalReferenceX=0;
 let opticalTipTimeout=null;
 let opticalPlayback={bpm:100,playing:false},opticalReconciliation=null,lastNativeEvents=[];
 let opticalPerf={frames:0,intervals:0,totalGapMs:0,maxGapMs:0,slowGaps:0,lastFrameMs:null};
 let opticalLoopEditing=false,opticalLoopStart=null,opticalWaitRaf=0,opticalWaitDeadline=0,opticalWaitDuration=0;
 let opticalHand=0,opticalCueKey='',opticalCueSvg=null;
 let opticalContextState=null,opticalContextMeasure=-1;
 const viewport=document.getElementById('viewport'), message=document.getElementById('loading');
 function inform(s){message.textContent=s;message.style.display='block';}
 function atBeat(beat,smooth){
  if(freeLayout)return;
  if(!loaded || !osmd || !osmd.cursor) {seekBeat=beat;return;}
  const cursor=osmd.cursor;
  if(!Number.isFinite(beat)||beat<0)return;
  if(appliedBeat>=0&&Math.abs(appliedBeat-beat)<0.012)return;
  // MusicXML quarter note = 0.25 of an OSMD whole note.
  const target=beat/4.0-0.000025;
  try{
   // Apply the transition before moving the OSMD cursor. Otherwise its
   // first update jumps instantly even when sheet scrolling is smooth.
   const el=cursor.cursorElement;
   if(el)el.style.transition=smooth
      ?'left 420ms ease-in-out, top 420ms ease-in-out'
      :'none';
   if(appliedBeat>beat+0.002){cursor.reset();}
   let count=0;
   while(!cursor.iterator.endReached && cursor.iterator.currentTimeStamp.RealValue < target && count++<12000){
    cursor.next();
   }
   cursor.show();
   if(el){
    const b=el.getBoundingClientRect();
    const p=viewport.getBoundingClientRect();
    const desiredY=p.top+p.height*.38;
    const desiredX=p.left+p.width*.35;
    const top=viewport.scrollTop+b.top-desiredY;
    const left=viewport.scrollLeft+b.left-desiredX;
    const maxTop=Math.max(0,viewport.scrollHeight-viewport.clientHeight);
    const maxLeft=Math.max(0,viewport.scrollWidth-viewport.clientWidth);
    console.log('SCORE_SEEK',beat,'cursor=',Math.round(b.left),Math.round(b.top),
      'viewport=',Math.round(viewport.scrollTop),'max=',Math.round(maxTop));
    // A zero-beat starting cursor should not scroll the original score away.
    if(beat>0.01||viewport.scrollTop>0||viewport.scrollLeft>0){
      viewport.scrollTo({top:Math.min(maxTop,Math.max(0,top)),
       left:Math.min(maxLeft,Math.max(0,left)),behavior:smooth?'smooth':'auto'});
    }
   }
   appliedBeat=beat;
  }catch(e){ if(window.AndroidNotation)AndroidNotation.onError('Navegação: '+e.message); }
 }
 function cancelOpticalWait(){
  if(opticalWaitRaf)cancelAnimationFrame(opticalWaitRaf);
  opticalWaitRaf=0;opticalWaitDeadline=0;
  // The score always returns to the native clock's optical position.
  document.getElementById('score').style.transform='none';
  document.getElementById('optical-wait').style.display='none';
 }
 function beginOpticalWait(milliseconds){
  cancelOpticalWait();
  if(!studyProof||!optical||!Number.isFinite(milliseconds)||milliseconds<=0)return;
  opticalWaitDuration=milliseconds;opticalWaitDeadline=performance.now()+milliseconds;
  const widget=document.getElementById('optical-wait');
  const score=document.getElementById('score');
  // Pure presentation offset: do not seek or advance a musical beat.
  // A rightward starting offset progressively reaches the fixed reference.
  const preparationDistance=Math.min(100,viewport.clientWidth*.18);
  widget.style.display='block';
  document.getElementById('optical-wait-label').textContent='Preparação';
  console.log('POC_WAIT_PREPARE '+JSON.stringify({ms:milliseconds,beat:seekBeat,
   travelPx:preparationDistance}));
  let lastBucket=-1;
  function paint(){
   opticalWaitRaf=0;
   if(!studyProof||!opticalWaitDeadline)return;
   const remaining=Math.max(0,opticalWaitDeadline-performance.now());
   const progress=1-remaining/opticalWaitDuration;
   // Smoothstep: gradual departure and arrival without a jump at completion.
   const eased=progress*progress*(3-2*progress);
   const remainingPx=preparationDistance*(1-eased);
   score.style.transform='translate3d('+remainingPx.toFixed(2)+'px,0,0)';
   const bucket=Math.min(4,Math.floor(progress*4));
   if(bucket!==lastBucket){
    lastBucket=bucket;
    console.log('POC_WAIT_FRAME '+JSON.stringify({progress:+progress.toFixed(3),
     remainingPx:+remainingPx.toFixed(2)}));
   }
   document.getElementById('optical-wait-fill').style.width=
     (100*progress).toFixed(1)+'%';
   if(remaining>0)opticalWaitRaf=requestAnimationFrame(paint);
   else {console.log('POC_WAIT_COMPLETE');cancelOpticalWait();requestAnimationFrame(logStudyTouchTarget);}
  }
  paint();
 }
 // Measure JS animation callbacks, NOT GPU composition FPS. No network or telemetry.
 function reportOpticalPerf(reason){
  if(opticalPerf.frames){
   console.log('POC_OPTICAL_PERF '+JSON.stringify({reason:reason,
    frames:opticalPerf.frames,intervals:opticalPerf.intervals,
    meanCallbackGapMs:opticalPerf.intervals?+(opticalPerf.totalGapMs/opticalPerf.intervals).toFixed(2):null,
    maxCallbackGapMs:+opticalPerf.maxGapMs.toFixed(2),slowGapsOver50Ms:opticalPerf.slowGaps,
    svgNodes:document.querySelectorAll('#score svg *').length,
    scrollWidth:viewport.scrollWidth,scrollViewport:viewport.clientWidth}));
  }
  opticalPerf={frames:0,intervals:0,totalGapMs:0,maxGapMs:0,slowGaps:0,lastFrameMs:null};
 }
 function cancelOptical(){
  reportOpticalPerf('teardown');
  if(opticalRaf)cancelAnimationFrame(opticalRaf);
  opticalRaf=0;optical=null;opticalAnchor=null;opticalFrames=0;opticalReconciliation=null;
  opticalLoopEditing=false;opticalLoopStart=null;
  opticalCueKey='';opticalCueSvg=null;
  opticalContextState=null;opticalContextMeasure=-1;
  document.getElementById('optical-context-rail').innerHTML='';
 }
 /** Preserve OSMD's native engraving geometry and MusicXML note identity.
  * Fit the complete two-staff SVG uniformly into the measured WebView height.
  * The 4 CSS px inset on each side protects antialiasing and stroke edges.
  */
 function fitOpticalSvg(svg){
  if(!svg||!studyProof)return;
  let baseWidth=Number(svg.dataset.opticalNativeWidth);
  let baseHeight=Number(svg.dataset.opticalNativeHeight);
  if(!(baseWidth>0&&baseHeight>0)){
   const rect=svg.getBoundingClientRect();
   baseWidth=rect.width;baseHeight=rect.height;
   if(!(baseWidth>0&&baseHeight>0))throw Error('OSMD sem tamanho SVG válido');
   // OSMD may engrave tuplet numerals above its declared viewBox. Include
   // actual ink before scaling: changing only CSS height clips those glyphs.
   // Native note coordinates and all musical events remain untouched.
   const vb=svg.viewBox&&svg.viewBox.baseVal;
   if(vb&&vb.height>0&&typeof svg.getBBox==='function'){
    const ink=svg.getBBox(),unitsToCss=baseHeight/vb.height;
    if(![ink.y,ink.height].every(Number.isFinite))throw Error('Envelope musical inválido');
    const top=Math.min(vb.y,ink.y-4);
    const bottom=Math.max(vb.y+vb.height,ink.y+ink.height+4);
    const envelopeHeight=bottom-top;
    svg.dataset.opticalInkTop=String(ink.y);
    svg.dataset.opticalInkBottom=String(ink.y+ink.height);
    svg.setAttribute('viewBox',[vb.x,top,vb.width,envelopeHeight].join(' '));
    baseHeight=envelopeHeight*unitsToCss;
   }
   svg.dataset.opticalNativeWidth=String(baseWidth);
   svg.dataset.opticalNativeHeight=String(baseHeight);
  }
  osmdRenderedWidth=viewport.clientWidth;
  const viewportHeight=viewport.clientHeight;
  const safetyInset=4;
  const availableHeight=Math.max(1,viewportHeight-safetyInset*2);
  const scale=availableHeight/baseHeight;
  svg.dataset.opticalAvailableHeight=String(availableHeight);
  opticalDisplayScale=scale;
  svg.style.width=(baseWidth*scale)+'px';
  svg.style.height=(baseHeight*scale)+'px';
  const score=document.getElementById('score');
  score.style.width=(baseWidth*scale)+'px';
  score.style.height=(baseHeight*scale)+'px';
  let staffSpace=0,staffGapSpaces=0,nativeStaffSpace=0;
  const stafflines=Array.from(svg.querySelectorAll('g.staffline')).slice(0,2);
  const lineSets=stafflines.map(function(staffline){
   const measure=Array.from(staffline.children).find(function(node){
    return node.classList&&node.classList.contains('vf-measure');
   });
   return measure&&Array.from(measure.children).filter(function(node){
    return node.tagName&&node.tagName.toLowerCase()==='path';
   }).slice(0,5);
  });
  if(lineSets[0]&&lineSets[0].length>=5){
   try{const a=lineSets[0][0].getBBox(),b=lineSets[0][1].getBBox();
    nativeStaffSpace=Math.abs((b.y+b.height/2)-(a.y+a.height/2));
    staffSpace=nativeStaffSpace*scale;
    if(lineSets[1]&&lineSets[1].length>=1&&nativeStaffSpace>0){
     const upper=lineSets[0][4].getBBox(),lower=lineSets[1][0].getBBox();
     staffGapSpaces=((lower.y+lower.height/2)-(upper.y+upper.height/2)-(Number(svg.dataset.studyStaffShiftY)||0))/nativeStaffSpace;
    }
   }catch(e){}
  }
  svg.dataset.opticalStaffSpaceCss=String(staffSpace);
  svg.dataset.opticalStaffGapSpaces=String(staffGapSpaces);
  console.log('POC_SVG_FIT '+JSON.stringify({scale:scale,rawWidth:baseWidth,
   rawHeight:baseHeight,width:baseWidth*scale,height:baseHeight*scale,
   webviewWidth:document.documentElement.clientWidth,viewportWidth:viewport.clientWidth,viewportHeight:viewportHeight,availableHeight:availableHeight,safetyInsetCssPx:safetyInset,simultaneous:baseHeight*scale<=viewportHeight,verticalOverflow:Math.max(0,baseHeight*scale-viewportHeight),
   viewportMaxScrollTop:getComputedStyle(viewport).overflowY==='hidden'?0:Math.max(0,viewport.scrollHeight-viewport.clientHeight),
   nativeStaffSpaceCssPx:staffSpace,staffSeparationSpaces:staffGapSpaces})); }
 function adaptStudySvg(svg){
  studyWindow=null;studyWindowRows=[];studyWindowGlobal=null;delete svg._studyWindowBounds;svg.style.overflow='visible';
  StudyWords.restore(svg);
  StudyCurve.restore(svg);
  StudyProfile.restorePresentationAdjustments(svg);
  StudyProfile.restoreStaffGap(svg);
  if(svg._studyBaseEnvelope){
   svg.setAttribute('viewBox',svg._studyBaseEnvelope.viewBox);
   svg.dataset.opticalNativeHeight=svg._studyBaseEnvelope.height;
  }
  fitOpticalSvg(svg);
  if(!svg._studyBaseEnvelope)svg._studyBaseEnvelope={viewBox:svg.getAttribute('viewBox'),height:svg.dataset.opticalNativeHeight};
 const beforeCompact=StudyProfile.inspectSvg(svg);
 const beforeCompactHeight=svg.getBoundingClientRect().height;
 studyVerticalAdaptation={status:'not-needed',beforeStaffSpace:beforeCompact.staffSpace,
  afterStaffSpace:beforeCompact.staffSpace,beforeHeight:beforeCompactHeight,
  afterHeight:beforeCompactHeight,accepted:false};
 if(window.__testDisableStudyVerticalAdaptation!==true&&StudyProfile.shouldCompactVertical(studyProfile,viewport.clientHeight,beforeCompact.staffSpace)){
  // Move only the lower engraved staff within its system. OSMD's musical
  // graph and x/beat anchors remain intact; the complete ink envelope is
  // refit below after a primitive-geometry collision check.
  studyVerticalAdaptation=StudyProfile.compactStaffGap(svg,studyProfile,viewport.clientHeight);
  if(studyVerticalAdaptation.accepted){
   const shift=studyVerticalAdaptation.delta;
   optical=OpticalTimeMap.fromGraphical(osmd.graphic);
   optical.notes.forEach(function(note){if(note.staff===2)note.y-=shift;});
   opticalReconciliation=OpticalTimeMap.reconcile(optical.notes,Array.isArray(lastNativeEvents)?lastNativeEvents:[]);
   fitOpticalSvg(svg);
   const compactGeometry=StudyProfile.inspectSvg(svg);
   const compactRows=StudyProfile.shiftEngravingRows(EngravingAudit.inspect(osmd.graphic,Infinity),2,shift);
   const compactAudit=StudyProfile.assess(compactRows,Object.assign({},compactGeometry,{availableHeight:viewport.clientHeight}));
   const compactFidelity=Array.isArray(lastNativeEvents)&&lastNativeEvents.length
    ?StudyProfile.compare(EngravingAudit.inspect(osmd.graphic,Infinity),lastNativeEvents):{missing:0,unexpected:0,skipped:true};
   const safe=!compactGeometry.inkClipped&&!compactAudit.clipped&&compactAudit.alerts.indexOf('vertical-overflow')<0&&
    !compactFidelity.missing&&!compactFidelity.unexpected;
   studyVerticalAdaptation=Object.assign({},studyVerticalAdaptation,{status:safe?'compacted':'rejected',accepted:safe,
    beforeHeight:beforeCompactHeight,afterHeight:svg.getBoundingClientRect().height,
    beforeStaffSpace:beforeCompact.staffSpace,afterStaffSpace:compactGeometry.staffSpace,
    inkClipped:compactGeometry.inkClipped,noteheadClipping:compactAudit.clipped,nativeFidelity:compactFidelity,
    reason:safe?null:'ink clipping, vertical overflow, or native-event divergence'});
   if(!safe){
    StudyProfile.restoreStaffGap(svg);
    optical=OpticalTimeMap.fromGraphical(osmd.graphic);
    opticalReconciliation=OpticalTimeMap.reconcile(optical.notes,Array.isArray(lastNativeEvents)?lastNativeEvents:[]);
    fitOpticalSvg(svg);
   }
  }
 }
 console.log('STUDY_VERTICAL_ADAPTATION '+JSON.stringify(studyVerticalAdaptation));
 }
 function refreshStudyAnalysis(svg){
  if(!svg||!studyProof||!osmd)return;
  const experimental=Number(window.__testStudyCurveFactor),
   chosen=experimental>0&&experimental<1?experimental:.6,
   eligible=studyProfile&&studyProfile.staffCount===2&&
    (studyProfile.notes>=200||studyProfile.maxNotesPerMeasure>=16)&&
    viewport.clientHeight<=240&&Number(svg.dataset.opticalStaffSpaceCss)<6;
  let curveAdaptation={status:'not-needed',accepted:false,edited:0};
  if(window.__testDisableStudyCurveAdaptation!==true&&
     (eligible||(experimental>0&&experimental<1))){
   // The experimental override may intentionally measure rejected shapes.
   // Production is allowed to keep only contact-free, reversible edits.
   const geometry=StudyWindow.collect(svg);
   if(experimental>0&&experimental<1){
    const edits=StudyCurve.trial(svg,chosen),
     contacts=edits.length?StudyCurve.collisionReport(svg,geometry.boxes):[];
    curveAdaptation={status:'experimental',accepted:false,edited:edits.length,
     colliding:contacts.filter(c=>c.unsupportedTransform||c.introducedContacts>0)};
   }else curveAdaptation=StudyCurve.applySafe(svg,chosen,function(){return StudyWindow.collect(svg).boxes;});
  }
  if(curveAdaptation.edited)console.log('STUDY_B1_SLUR_ADAPTATION '+JSON.stringify(curveAdaptation));
  // Source-aware, reversible numeric directions may move only when the
  // collision audit proves the new position safe. The Study-only change
  // never modifies the authoritative MusicXML or MIDI events.
  const wordAdjustments=eligible&&window.__testDisableStudyWords!==true?
   StudyWords.apply(svg,studyWordSourceNumbers,function(){return StudyWindow.collect(svg).boxes;}):[];
  const hiddenChordLabels=StudyProfile.applyChordCollisionPolicy(svg);
  studyDynamicAdjustments=window.__testDisableDynamicCollisionPolicy===true?[]:StudyProfile.applyDynamicCollisionPolicy(svg);
  if(studyDynamicAdjustments.length){
   const vb=svg.viewBox.baseVal,ink=svg.getBBox(),ratio=Number(svg.dataset.opticalNativeHeight)/vb.height;
   const top=Math.min(vb.y,ink.y-4),bottom=Math.max(vb.y+vb.height,ink.y+ink.height+4);
   svg.setAttribute('viewBox',[vb.x,top,vb.width,bottom-top].join(' '));
   svg.dataset.opticalNativeHeight=String((bottom-top)*ratio);
   fitOpticalSvg(svg);
  }
  const rows=EngravingAudit.inspect(osmd.graphic,Infinity);
  const visibleRows=studyVerticalAdaptation.accepted
   ?StudyProfile.shiftEngravingRows(rows,2,studyVerticalAdaptation.delta):rows;
  studyAnalysis=StudyProfile.assess(visibleRows,
   Object.assign(StudyProfile.inspectSvg(svg),{availableHeight:viewport.clientHeight,mapping:opticalReconciliation}));
  studyAnalysis.dynamicRepositionDetails=studyDynamicAdjustments;
  studyAnalysis.repositionedDynamics=studyDynamicAdjustments.length;
  studyAnalysis.hiddenChordLabels=hiddenChordLabels;
  studyAnalysis.layoutAdaptation=studyVerticalAdaptation;
  studyAnalysis.curveAdaptation=curveAdaptation;
  studyAnalysis.wordAdaptations=wordAdjustments;
  studyAnalysis.viewport={width:viewport.clientWidth,height:viewport.clientHeight};
 }
 function prepareStudyWindow(svg){
  if(window.__testDisableStudyVerticalAdaptation===true||!studyProfile||studyProfile.staffCount!==2||
     viewport.clientHeight>240||studyAnalysis.staffSpace>=6)return;
  const geometry=StudyWindow.collect(svg),vb=svg.viewBox.baseVal;
  studyWindow=StudyWindow.plan(geometry.boxes,{bounds:[vb.x,vb.y,vb.width,vb.height],
   width:viewport.clientWidth,height:viewport.clientHeight,context:geometry.context,
   firstX:optical.timeline.xAt(0),railUnits:opticalContextState?opticalContextState.contextRailUnits:130,
   probeMaxFit:window.__testStudyMaxFit===true,
   safetyLeadCells:Number.isFinite(Number(window.__testStudyLeadCells))&&
    window.__testStudyLeadCells!==undefined?Number(window.__testStudyLeadCells):1,
   localScaleExperiment:window.__testStudyLocalScale===true});
  if(!studyWindow)return;
  studyWindowRows=EngravingAudit.inspect(osmd.graphic,Infinity);
  if(studyVerticalAdaptation.accepted)studyWindowRows=StudyProfile.shiftEngravingRows(studyWindowRows,2,studyVerticalAdaptation.delta);
  studyWindowGlobal=studyAnalysis;
  console.log('STUDY_WINDOW_PLAN '+JSON.stringify({windows:studyWindow.windows.length,
   fullStaffSpace:10*studyWindow.fullScale,minStaffSpace:Math.min.apply(null,studyWindow.windows.map(function(w){return w.staffSpace;})),
   maxStaffSpace:Math.max.apply(null,studyWindow.windows.map(function(w){return w.staffSpace;}))}));
 }
 function updateStudyWindow(x){
  if(!studyWindow)return false;
  const w=StudyWindow.sample(studyWindow,x);
  if(!w)return false;
  const index=w.index,previous=studyWindow.applied;
  // Sub-pixel camera changes do not merit a complete Android WebView reflow.
  if(previous&&previous.index===index&&
     Math.abs(w.staffSpace-previous.staffSpace)<.02&&
     Math.abs(w.top-previous.top)*w.scale<.35)return false;
  const svg=document.querySelector('#score svg');
  const audit=StudyWindow.inspect(studyWindow,w);
  if(audit.clipped)throw Error('Janela de Estudo cortaria símbolos musicais');
  studyWindow.current=index;
  studyWindow.applied=w;
  svg.style.overflow='hidden';
  svg.setAttribute('viewBox',[studyWindow.bounds[0],w.top,studyWindow.bounds[2],w.height].join(' '));
  svg.dataset.opticalNativeHeight=String(w.height);
  svg._studyWindowBounds={left:w.left,right:w.right,inkTop:w.inkTop,inkBottom:w.inkBottom};
  fitOpticalSvg(svg);
  alignOpticalScore(0);
  if(!previous||previous.index!==index){
   // Full graphical audit only on entering a different musical region.
   const rows=studyWindowRows.filter(function(r){return !r.headBox||
    r.headBox[0]+r.headBox[2]>=w.left&&r.headBox[0]<=w.right;});
   studyAnalysis=Object.assign({},studyWindowGlobal,StudyProfile.assess(rows,
    Object.assign(StudyProfile.inspectSvg(svg),{availableHeight:viewport.clientHeight,mapping:opticalReconciliation})));
  }else{
   // On sub-cell camera moves the visible score nodes, pitches, and mapping
   // are unchanged. Avoid scanning thousands of SVG glyphs at playback rate.
   studyAnalysis=Object.assign({},studyAnalysis,{staffSpace:10*w.scale,
    availableHeight:viewport.clientHeight});
  }
  studyAnalysis.window={index:index,count:studyWindow.windows.length,left:w.left,right:w.right,
   inkTop:w.inkTop,inkBottom:w.inkBottom,checkedPrimitives:audit.checkedPrimitives,clippedPrimitives:audit.clipped,
   fullStaffSpace:10*studyWindow.fullScale};
  opticalContextMeasure=-1;
  return true;
 }
 function alignOpticalScore(beat){
  const baseReference=Math.min(viewport.clientWidth*.4,
   Math.min(viewport.clientWidth,130*opticalDisplayScale)+12);
  const railUnits=opticalContextState?opticalContextState.contextRailUnits:130;
  opticalReferenceX=Math.min(Math.max(1,viewport.clientWidth-24),
   Math.max(baseReference,railUnits*opticalDisplayScale+12));
  opticalOffset=Math.max(0,opticalReferenceX+53-optical.timeline.xAt(beat)*opticalDisplayScale);
  document.getElementById('score').style.marginLeft=opticalOffset+'px';
  document.getElementById('optical-reference').style.left=opticalReferenceX+'px';
 }
 function makeOpticalContextState(svg,columns){
  const rail=document.getElementById('optical-context-rail');
  rail.innerHTML='';
  if(!svg||!columns||!columns.length){opticalContextState=null;return;}
  // Rebuilding after a height change must not clone the previous hidden state.
  Array.from(svg.querySelectorAll('g.vf-clef,g.vf-keysignature,g.vf-timesignature,g.vf-brace')).forEach(function(node){node.style.visibility='';});
  const candidates=Array.from(svg.querySelectorAll('g.staffline')).filter(function(node){
   return node.classList&&node.classList.contains('staffline');
  });

      refreshStudyAnalysis(resizedSvg);
      makeOpticalContextState(resizedSvg,osmd.graphic&&osmd.graphic.measureList||[]);
      prepareStudyWindow(resizedSvg);
      opticalCueKey='';paintOpticalCues(seekBeat);
      alignOpticalScore(seekBeat);
      paintOpticalContext(seekBeat,true);
      const now=performance.now();
      const activeBeat=opticalAnchor
       ?opticalAnchor.beat+(now-opticalAnchor.at)*opticalAnchor.bpm/60000
       :seekBeat;
      opticalPosition(activeBeat);
      console.log('POC_RESIZE_HEIGHT_ONLY '+JSON.stringify({width:viewport.clientWidth,
       height:viewport.clientHeight,beat:activeBeat,svgNodes:document.querySelectorAll('#score svg *').length}));
     }
     return;
    }
    clearTimeout(renderTimer);
    renderTimer=setTimeout(function(){try{
     osmd.render();appliedBeat=-1;
     osmdRenderedWidth=viewport.clientWidth;
     osmdRenderedHeight=viewport.clientHeight;
     if(studyProof){
      const resizedSvg=document.querySelector('#score svg');
      studyDynamicAdjustments=[];
      adaptStudySvg(resizedSvg);
      optical=OpticalTimeMap.fromGraphical(osmd.graphic);
      if(studyVerticalAdaptation.accepted)optical.notes.forEach(function(note){if(note.staff===2)note.y-=studyVerticalAdaptation.delta;});
      // Graphical positions are invalid after a re-layout: reconcile and bind again.
      opticalReconciliation=OpticalTimeMap.reconcile(optical.notes,Array.isArray(lastNativeEvents)?lastNativeEvents:[]);
      refreshStudyAnalysis(resizedSvg);
      studyAnalysis.layoutAdaptation=studyVerticalAdaptation;
      attachOpticalNoteTouch(document.querySelector('#score svg'));
      paintOpticalCues(seekBeat);
      alignOpticalScore(seekBeat);
      document.getElementById('score').style.paddingRight=(viewport.clientWidth*.65)+'px';
      makeOpticalContextState(resizedSvg,osmd.graphic&&osmd.graphic.measureList||[]);
      prepareStudyWindow(resizedSvg);
      opticalSeek(seekBeat,opticalPlayback.bpm,opticalPlayback.playing);
     }else if(!freeLayout)atBeat(seekBeat,false);
    }catch(e){console.log('POC_RESIZE_ERROR',e.message)}},220);
   }
 };
 viewport.addEventListener('scroll',function(){
  if(!studyWindow||!optical)return;
  const x=(viewport.scrollLeft-opticalOffset+opticalReferenceX+53)/opticalDisplayScale;
  if(updateStudyWindow(x)){
   viewport.scrollLeft=Math.max(0,x*opticalDisplayScale+opticalOffset-opticalReferenceX-53);
   paintOpticalContext(seekBeat,true);
  }
 });
 window.addEventListener('resize',function(){PianoNotation.resize();});
 // Observe the completed gesture without consuming note taps, drags or loop edits.
 let chromeTouch=null;
 document.addEventListener('pointerdown',function(e){chromeTouch={x:e.clientX,y:e.clientY,id:e.pointerId};});
 document.addEventListener('pointercancel',function(){chromeTouch=null;});
 document.addEventListener('pointerup',function(e){
  const start=chromeTouch;chromeTouch=null;
  if(!freeLayout&&start&&start.id===e.pointerId&&Math.hypot(e.clientX-start.x,e.clientY-start.y)<10)
   requestAnimationFrame(function(){if(window.AndroidNotation&&AndroidNotation.onStudyTap)AndroidNotation.onStudyTap();});
 });
 if(window.AndroidNotation)AndroidNotation.onReady();
})();
