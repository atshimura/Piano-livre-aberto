pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
rootProject.name = 'PianoLivre'
include ':app'

/*
 * APK version is controlled by gradle.properties, not by a CI-only rewrite.
 * AGP's finalizeDsl is invoked AFTER app/build.gradle has configured
 * defaultConfig and BEFORE variants / APK manifests are finalized.
 * The old app/build.gradle literal is a historical fallback; these properties
 * are the effective single source of truth for any Gradle build.
 * Stable private-beta signing configuration is left completely untouched.
 */
gradle.beforeProject { project ->
    if (project.path == ':app') {
        project.pluginManager.withPlugin('com.android.application') {
            project.extensions.getByName('androidComponents').finalizeDsl { androidDsl ->
                def code = project.providers.gradleProperty('pianolivre.beta.versionCode').get()
                def name = project.providers.gradleProperty('pianolivre.beta.versionName').get()
                int newCode = Integer.parseInt(code)
                if (newCode < 20 || !name.trim()) {
                    throw new GradleException('Invalid beta APK version')
                }
                androidDsl.defaultConfig.versionCode = newCode
                androidDsl.defaultConfig.versionName = name
            }
        }
    }
}
