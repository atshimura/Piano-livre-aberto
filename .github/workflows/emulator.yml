name: Open Piano Livre - emulator Android
on:
  workflow_dispatch:
  pull_request:
    branches: [main, feat/tela-inicial-piano-livre, feat/tela-estudar-piano-livre]
    paths:
      - 'PianoLivreAndroid/app/**'
      - 'PianoLivreAndroid/tests/**'
      - 'PianoLivreAndroid/scripts/**'
      - 'PianoLivreAndroid/gradle.properties'
      - '.github/workflows/emulator.yml'
      - 'docs/70-TELA-INICIAL-PROMPT-01.md'
  push:
    branches: [main]
    paths:
      - 'PianoLivreAndroid/app/**'
      - 'PianoLivreAndroid/tests/**'
      - 'PianoLivreAndroid/scripts/**'
      - 'PianoLivreAndroid/gradle.properties'
      - 'PianoLivreAndroid/settings.gradle'
      - '.github/workflows/emulator.yml'

permissions:
  contents: read

jobs:
  midi-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: PianoLivreAndroid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM on standard GitHub Linux runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_3
          disable-animations: true
          working-directory: PianoLivreAndroid
          script: |
            gradle --no-daemon :app:assembleDebug
            adb shell svc wifi disable
            adb shell svc data disable
            adb install app/build/outputs/apk/debug/app-debug.apk
            python3 tests/emulator_home_refinements.py
            python3 tests/emulator_midi_interfaces.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PianoLivre-prompt03-midi-visual-review
          retention-days: 14
          path: |
            PianoLivreAndroid/piano-prompt03-*
            PianoLivreAndroid/piano-home-refined-*
            PianoLivreAndroid/piano-home-phone.png
            PianoLivreAndroid/piano-home-tablet.png
            PianoLivreAndroid/piano-ui-failure.*
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: PianoLivreAndroid
    steps:
      - uses: actions/checkout@v4
      - name: Verify safe public assets, license, and isolated Android app
        run: python3 scripts/verify_public_snapshot.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM on standard GitHub Linux runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Configure permanent public signing for trusted main only
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PUBLIC_KEYSTORE_B64: ${{ secrets.PIANOLIVRE_PUBLIC_KEYSTORE_BASE64 }}
          PUBLIC_STORE_PASSWORD: ${{ secrets.PIANOLIVRE_PUBLIC_STORE_PASSWORD }}
          PUBLIC_KEY_ALIAS: ${{ secrets.PIANOLIVRE_PUBLIC_KEY_ALIAS }}
          PUBLIC_KEY_PASSWORD: ${{ secrets.PIANOLIVRE_PUBLIC_KEY_PASSWORD }}
        run: |
          test -n "$PUBLIC_KEYSTORE_B64" && test -n "$PUBLIC_STORE_PASSWORD" && test -n "$PUBLIC_KEY_ALIAS" && test -n "$PUBLIC_KEY_PASSWORD"
          keypath="$RUNNER_TEMP/pianolivre-open-beta.jks"
          printf '%s' "$PUBLIC_KEYSTORE_B64" | base64 --decode > "$keypath"
          chmod 600 "$keypath"
          echo "PIANOLIVRE_PUBLIC_KEYSTORE_FILE=$keypath" >> "$GITHUB_ENV"
          echo "PIANOLIVRE_PUBLIC_STORE_PASSWORD=$PUBLIC_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "PIANOLIVRE_PUBLIC_KEY_ALIAS=$PUBLIC_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "PIANOLIVRE_PUBLIC_KEY_PASSWORD=$PUBLIC_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "STABLE_PUBLIC_BETA_SIGNING_CONFIGURED"
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_3
          disable-animations: true
          working-directory: PianoLivreAndroid
          script: |
            test ! -e ../DO_NOT_PUBLISH_OWNER_SCORES.txt
            gradle --no-daemon :app:assembleDebug :app:assembleRelease
            mkdir -p build
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/release/app-release.apk > build/public-release-apk-metadata.txt
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk > build/public-release-signature.txt
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -q "package: name='br.org.pianolivre.opensource'"
            adb shell svc wifi disable
            adb shell svc data disable
            python3 tests/emulator_study_baseline.py
            adb install app/build/outputs/apk/debug/app-debug.apk
            python3 tests/emulator_study_layout.py
            python3 tests/emulator_midi_interfaces.py
            adb uninstall br.org.pianolivre.opensource
            python3 tests/emulator_upgrade.py
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n br.org.pianolivre.opensource/br.org.pianolivre.MainActivity
            sleep 5
            adb shell pidof br.org.pianolivre.opensource
            adb logcat -c || echo 'WARNING: logcat clear unavailable on this emulator'
            adb shell am force-stop br.org.pianolivre.opensource
            adb shell am start -n br.org.pianolivre.opensource/br.org.pianolivre.MainActivity --ez upgrade_selftest true --ez backup_selftest true --ez midi_selftest true --ez profiles_selftest true --ez library_selftest true --ez history_selftest true --ez xml_input_selftest true --ez midifile_selftest true --ez midi_import_ui_selftest true
            for attempt in $(seq 1 60); do adb logcat -d -v brief | grep -q 'HISTORY_ACTIVITY_SELFTEST_PASS' && break; sleep 1; done
            adb logcat -d -v brief > piano-selftests.log
            adb logcat -d -v brief | grep 'UPGRADE_SELFTEST_PASS'
            adb logcat -d -v brief | grep 'BACKUP_SELFTEST_PASS'
            adb logcat -d -v brief | grep 'MIDI_SESSION_SELFTEST_PASS'
            adb logcat -d -v brief | grep 'PROFILES_SELFTEST_PASS'
            adb logcat -d -v brief | grep 'LIBRARY_SELFTEST_PASS'
            adb logcat -d -v brief | grep 'HISTORY_SELFTEST_PASS'
            adb logcat -d -v brief | grep 'MIDIFILE_SELFTEST_PASS'
            adb logcat -d -v brief | grep 'XML_INPUT_SELFTEST_PASS'
            adb logcat -d -v brief | grep 'HISTORY_ACTIVITY_SELFTEST_PASS'
            python3 tests/emulator_ui.py
            adb shell am force-stop br.org.pianolivre.opensource
            adb logcat -c || echo 'WARNING: logcat clear unavailable before isolated Descobrir test'
            adb shell am start -n br.org.pianolivre.opensource/br.org.pianolivre.MainActivity --ez discovery_selftest true
            for attempt in $(seq 1 180); do adb logcat -d -v brief | grep -q 'DISCOVERY_UI_SELFTEST_PASS' && break; sleep 1; done
            adb logcat -d -v brief > piano-discovery-selftest.log
            adb logcat -d -v brief | grep 'DISCOVERY_UI_SELFTEST_BEGIN'
            adb logcat -d -v brief | grep 'DISCOVERY_UI_SELFTEST_PASS'
            for image in c2 c3 f3 c4 eb4 g4 c6 low-chord high-chord grand-chord grand-sequence c-major phone-sequence tablet-sequence; do adb shell run-as br.org.pianolivre.opensource cat "cache/discovery-staff-$image.png" > "piano-discovery-staff-$image.png"; done
            python3 tests/emulator_study_failure.py
            python3 tests/emulator_polyphony.py
            python3 tests/emulator_notation06.py
            python3 tests/emulator_responsive.py
            python3 tests/emulator_study_session.py
            python3 tests/emulator_release.py
            if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then python3 tests/emulator_public_upgrade.py; fi
            echo PUBLIC_ANDROID_EMULATOR_SMOKE_PASS
      - name: Upload temporary validation APK for this pull request
        if: success() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: PianoLivre-prompt-03-validation-apk
          path: |
            PianoLivreAndroid/app/build/outputs/apk/release/app-release.apk
            PianoLivreAndroid/build/public-release-signature.txt
            PianoLivreAndroid/build/public-release-apk-metadata.txt
          if-no-files-found: error
          retention-days: 14
      - name: Verify captured Android visual evidence
        if: success()
        run: |
          python3 - <<'PY'
          import json, os, pathlib, struct
          names = [
              "piano-engraved.png",
              "piano-osmd-poc.png",
              "piano-osmd-poc-moving.png",
              "piano-osmd-poc-note-tap.png",
              "piano-entrega-b-long-resumed.png",
              "piano-entrega-b-long-guide.png",
              "piano-entrega-b-long-study.png",
              "piano-entrega-b-short-resumed.png",
              "piano-entrega-b-short-guide.png",
              "piano-entrega-b-short-study.png",
              "piano-osmd-poc-note-tap-expired.png",
              "piano-osmd-poc-loop.png",
              "piano-osmd-poc-wait.png",
              "piano-temporal-long.png",
              "piano-osmd-long.png",
              "piano-osmd-long-no-vertical-scroll.png",
              "piano-osmd-long-tap.png",
              "piano-osmd-long-moving.png",
              "piano-osmd-context-start.png",
              "piano-osmd-context-middle.png",
              "piano-osmd-context-end.png",
              "piano-osmd-context-changes.png",
              "piano-osmd-complex-synthetic.png",
              "piano-osmd-polyphony-triad.png",
              "piano-osmd-polyphony-adjacent.png",
              "piano-osmd-polyphony-unison.png",
              "piano-osmd-polyphony-both-staves.png",
              "piano-osmd-polyphony-guide-open.png",
              "piano-osmd-polyphony-guide-restored.png",
              "piano-release.png",
              "piano-home-phone.png",
              "piano-home-tablet.png",
              "piano-prompt02-before-phone.png",
              "piano-prompt02-before-tablet.png",
              "piano-03d-prompt02-phone-normal.png",
              "piano-03d-prompt02-phone-playing.png",
              "piano-03d-prompt02-phone-restored.png",
              "piano-03d-prompt02-tablet-normal.png",
              "piano-03d-prompt02-tablet-playing.png",
              "piano-03d-prompt02-tablet-restored.png",
              "piano-discovery-staff-c2.png",
              "piano-discovery-staff-c3.png",
              "piano-discovery-staff-f3.png",
              "piano-discovery-staff-c4.png",
              "piano-discovery-staff-eb4.png",
              "piano-discovery-staff-g4.png",
              "piano-discovery-staff-c6.png",
              "piano-discovery-staff-low-chord.png",
              "piano-discovery-staff-high-chord.png",
              "piano-discovery-staff-grand-chord.png",
              "piano-discovery-staff-grand-sequence.png",
              "piano-discovery-staff-c-major.png",
              "piano-discovery-staff-phone-sequence.png",
              "piano-discovery-staff-tablet-sequence.png",
          ]
          report = []
          for viewport in ('phone', 'landscape', 'tablet', 'compact-tablet'):
              for suffix in ('', '-library', '-grid'):
                  names.append('piano-home-refined-' + viewport + suffix + '.png')
          for viewport in ('phone', 'tablet'):
              for stage in ('home-disconnected','home-opening','home-connected','study-connected','study-hidden','study-restored','study-disconnected','study-unnamed','study-switched','home-reconnected','home-background-return','diagnostics'):
                  names.append('piano-prompt03-' + viewport + '-' + stage + '.png')
          for name in names:
              path = pathlib.Path(name)
              data = path.read_bytes()
              assert data[:8] == b"\x89PNG\r\n\x1a\n", f"{name} is not a PNG"
              width, height = struct.unpack(">II", data[16:24])
              assert width > 0 and height > 0, f"{name} has invalid dimensions"
              report.append({"name": name, "bytes": len(data), "width": width, "height": height})
          output = {"sha": os.environ.get("GITHUB_SHA"), "images": report}
          pathlib.Path("piano-visual-evidence.json").write_text(
              json.dumps(output, indent=2), encoding="utf-8")
          print("ANDROID_VISUAL_EVIDENCE " + json.dumps(output), flush=True)
          PY
      - name: Print OSMD context selector diagnostics
        if: always()
        run: |
          for file in \
            piano-osmd-context-load-probe.txt \
            piano-osmd-context-changes.json \
            piano-osmd-context-failure-diagnostics.txt; do
            if [ -f "$file" ]; then
              echo "===== $file ====="
              cat "$file"
            fi
          done
      - name: Store Android UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PianoLivre-public-emulator-evidence
          retention-days: 14
          if-no-files-found: warn
          path: |
            PianoLivreAndroid/piano-prompt03-*
            PianoLivreAndroid/piano-home-refined-*
            PianoLivreAndroid/piano-prompt02-*
            PianoLivreAndroid/piano-ui-failure.*
            PianoLivreAndroid/piano-study*failure.png
            PianoLivreAndroid/piano-screen.png
