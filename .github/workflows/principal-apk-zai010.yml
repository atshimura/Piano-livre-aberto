# Atualizacao principal solicitada em 11/11/2026, a partir de ZAI-010.
# Compila ZAI-010 com identidade do aplicativo principal e assinatura permanente,
# sem push/merge em main, sem tag/Release e usando somente Secrets permanentes.
name: Piano Livre principal 0.9.71 - APK assinado ZAI-010

on:
  push:
    branches:
      - zai/ci/apk-principal-zai010-0-9-71-20261111
    paths:
      - '.github/workflows/principal-apk-zai010.yml'
      - 'PianoLivreAndroid/**'
      - 'docs/ZAI-010-LABORATORIO-CRIACAO-PAINEL-FIGURAS.md'

permissions:
  contents: read

concurrency:
  group: principal-zai010-assinado-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gerar-apk:
    if: github.event_name == 'push' && github.ref == 'refs/heads/zai/ci/apk-principal-zai010-0-9-71-20261111'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    defaults:
      run:
        working-directory: PianoLivreAndroid
    steps:
      - name: Checkout exato do codigo ZAI-010 (sem alterar main)
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Preparar Android SDK 36
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'

      - name: Auditoria da copia publica e contratos dirigidos
        run: |
          set -euo pipefail
          python3 scripts/verify_public_snapshot.py
          python3 tests/test_creation_responsive_contract.py
          python3 tests/test_creation_score_deletion_contract.py
          python3 tests/test_creation_library_contract.py
          python3 tests/test_impl4_osmd_contract.py
          python3 tests/test_workflow_contract_audit.py
          python3 tests/test_zai007_tie_free_contract.py
          python3 tests/test_zai008_layout_contract.py
          python3 tests/test_zai009_basic_contract.py
          python3 tests/test_zai010_dashboard_contract.py

      - name: Testes do motor ZAI-001 e das correcoes ZAI-010 na JVM
        run: |
          set -euo pipefail
          mkdir -p build/zai-test-jvm
          javac -encoding UTF-8 -d build/zai-test-jvm \
            app/src/main/java/br/org/pianolivre/MidiTakeRecorder.java \
            app/src/main/java/br/org/pianolivre/ScoreMidiPairer.java \
            app/src/main/java/br/org/pianolivre/ScoreTempoEstimator.java \
            app/src/main/java/br/org/pianolivre/ScoreRhythmQuantizer.java \
            app/src/main/java/br/org/pianolivre/ScoreXmlComposer.java \
            app/src/main/java/br/org/pianolivre/CreationScoreGenerator.java \
            app/src/main/java/br/org/pianolivre/CreationProjectStore.java \
            app/src/main/java/br/org/pianolivre/CreationScoreStore.java \
            app/src/main/java/br/org/pianolivre/SessionFiles.java \
            app/src/main/java/br/org/pianolivre/Score.java \
            tests/ZScoreGeneratorRhythmTest.java \
            tests/ZScoreGeneratorXmlTest.java \
            tests/CreationScoreStoreTest.java \
            tests/CreationC2DCorpusTest.java \
            tests/ZScoreRealMidiRegressionTest.java \
            app/src/main/java/br/org/pianolivre/DiscoveryScoreBuilder.java \
            tests/ZScoreChordFidelityRegressionTest.java \
            tests/ZScoreS1FidelityRegressionTest.java \
            tests/ZScoreTieFreeRegressionTest.java \
            tests/ZScoreRestOptimizationTest.java \
            tests/ZScoreBasicNotationRegressionTest.java \
            tests/ZScoreSimpleFiguresRegressionTest.java
          java -cp build/zai-test-jvm br.org.pianolivre.ZScoreGeneratorRhythmTest
          java -cp build/zai-test-jvm br.org.pianolivre.ZScoreGeneratorXmlTest
          java -cp build/zai-test-jvm br.org.pianolivre.CreationScoreStoreTest
          java -cp build/zai-test-jvm br.org.pianolivre.CreationC2DCorpusTest
          java -cp build/zai-test-jvm br.org.pianolivre.ZScoreRealMidiRegressionTest
          java -cp build/zai-test-jvm br.org.pianolivre.ZScoreChordFidelityRegressionTest
          java -cp build/zai-test-jvm br.org.pianolivre.ZScoreS1FidelityRegressionTest
          java -cp build/zai-test-jvm br.org.pianolivre.ZScoreTieFreeRegressionTest
          java -cp build/zai-test-jvm br.org.pianolivre.ZScoreRestOptimizationTest
          java -cp build/zai-test-jvm br.org.pianolivre.ZScoreBasicNotationRegressionTest
          java -cp build/zai-test-jvm br.org.pianolivre.ZScoreSimpleFiguresRegressionTest

      - name: Configurar chave publica permanente
        env:
          PUBLIC_KEYSTORE_B64: ${{ secrets.PIANOLIVRE_PUBLIC_KEYSTORE_BASE64 }}
          PUBLIC_STORE_PASSWORD: ${{ secrets.PIANOLIVRE_PUBLIC_STORE_PASSWORD }}
          PUBLIC_KEY_ALIAS: ${{ secrets.PIANOLIVRE_PUBLIC_KEY_ALIAS }}
          PUBLIC_KEY_PASSWORD: ${{ secrets.PIANOLIVRE_PUBLIC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$PUBLIC_KEYSTORE_B64" || -z "$PUBLIC_STORE_PASSWORD" || -z "$PUBLIC_KEY_ALIAS" || -z "$PUBLIC_KEY_PASSWORD" ]]; then
            echo "::error::Assinatura permanente indisponivel. O APK nao sera distribuido com chave temporaria."
            exit 1
          fi
          keypath="$RUNNER_TEMP/pianolivre-zai-public.jks"
          printf '%s' "$PUBLIC_KEYSTORE_B64" | base64 --decode > "$keypath"
          chmod 600 "$keypath"
          echo "PIANOLIVRE_PUBLIC_KEYSTORE_FILE=$keypath" >> "$GITHUB_ENV"
          echo "ASSINATURA_PERMANENTE_CONFIGURADA"

      - name: Compilar APK release PRINCIPAL assinado como 0.9.71 code 80
        env:
          PIANOLIVRE_PUBLIC_STORE_PASSWORD: ${{ secrets.PIANOLIVRE_PUBLIC_STORE_PASSWORD }}
          PIANOLIVRE_PUBLIC_KEY_ALIAS: ${{ secrets.PIANOLIVRE_PUBLIC_KEY_ALIAS }}
          PIANOLIVRE_PUBLIC_KEY_PASSWORD: ${{ secrets.PIANOLIVRE_PUBLIC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleRelease -Ppianolivre.zai.test=false -Ppianolivre.beta.versionCode=80 -Ppianolivre.beta.versionName=0.9.71-open-beta

      - name: Verificar APK, identidade, assinatura e integridade
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          mkdir -p build
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" > build/principal-signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > build/principal-metadata.txt
          echo "META_DADOS_VERIFICACAO_INICIAL"
          grep -E '^(package:|application-label:|sdkVersion:|targetSdkVersion:)' build/principal-metadata.txt
          grep 'Signer #1 certificate SHA-256 digest:' build/principal-signature.txt
          echo "CHECANDO: certificado permanente"
          grep -Fq 'Signer #1 certificate SHA-256 digest: 7bf1e9fa2d6cf1468463a2990e0a0699acc7c5efac45a77070c4d084e7798290' build/principal-signature.txt
          echo "CHECANDO: pacote principal"
          grep -Fq "package: name='br.org.pianolivre.opensource'" build/principal-metadata.txt
          echo "CHECANDO: rotulo do launcher"
          grep -Fq "application-label:'Piano Livre'" build/principal-metadata.txt
          if grep -Fq "name='br.org.pianolivre.opensource.zai'" build/principal-metadata.txt; then echo "::error::Identidade ZAi indevida no APK principal"; exit 1; fi
          echo "CHECANDO: versionCode 79"
          grep -Fq "versionCode='80'" build/principal-metadata.txt
          echo "CHECANDO: versionName 0.9.71"
          grep -Fq "versionName='0.9.71-open-beta'" build/principal-metadata.txt
          if grep -Fq 'android.permission.INTERNET' build/principal-metadata.txt; then
            echo "::error::APK recebeu permissao INTERNET"
            exit 1
          fi
          if grep -Fq 'application-debuggable' build/principal-metadata.txt; then
            echo "::error::APK nao pode ser depuravel"
            exit 1
          fi
          {
            echo "Piano Livre PRINCIPAL - APK de atualizacao 0.9.71-open-beta (sem Release publicada)"
            echo "commit=${GITHUB_SHA}"
            echo "branch=${GITHUB_REF_NAME}"
            sha256sum "$apk"
            grep 'Signer #1 certificate SHA-256 digest:' build/principal-signature.txt
            grep '^package:' build/principal-metadata.txt
            grep '^sdkVersion:' build/principal-metadata.txt
            grep '^targetSdkVersion:' build/principal-metadata.txt
          } > build/principal-apk-comprovante.txt
          cat build/principal-apk-comprovante.txt

      - name: Publicar APK principal como artefato temporario de instalacao
        uses: actions/upload-artifact@v4
        with:
          name: PianoLivre-PRINCIPAL-0.9.71-APK-assinado-${{ github.sha }}
          path: |
            PianoLivreAndroid/app/build/outputs/apk/release/app-release.apk
            PianoLivreAndroid/build/principal-apk-comprovante.txt
            PianoLivreAndroid/build/principal-signature.txt
            PianoLivreAndroid/build/principal-metadata.txt
          if-no-files-found: error
          retention-days: 30
