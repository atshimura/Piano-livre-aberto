name: 0.9.61 integral suite audit - focused prerelease
on:
  push:
    branches: [ci/0.9.61-integral-suite-audit]
permissions:
  contents: read
jobs:
  focused-release-and-c2:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    defaults:
      run:
        working-directory: PianoLivreAndroid
    steps:
      - uses: actions/checkout@v4
      - name: Fail-fast workflow audit and Python compilation
        run: |
          python3 tests/test_workflow_contract_audit.py
          python3 -m py_compile tests/emulator_release.py tests/emulator_public_upgrade.py tests/c2_d_ui_smoke.py
          python3 tests/test_study_position_labels.py
          python3 scripts/verify_public_snapshot.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile both test and non-debuggable release APKs
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_3
          disable-animations: true
          working-directory: PianoLivreAndroid
          script: |
            adb shell svc wifi disable
            adb shell svc data disable
            adb install app/build/outputs/apk/debug/app-debug.apk
            python3 tests/c2_d_ui_smoke.py
            python3 tests/emulator_release.py
            echo TARGETED_RELEASE_C2_SUITE_PASS
      - name: Capture objective proof even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focused-release-c2-validation
          retention-days: 7
          if-no-files-found: warn
          path: |
            PianoLivreAndroid/piano-release-home.png
            PianoLivreAndroid/piano-release.png
            PianoLivreAndroid/piano-release.json
            PianoLivreAndroid/piano-ui-failure.*
            PianoLivreAndroid/build/c2-d-evidence/
