name: Piano Livre - criacao excluir somente partitura (basico sem APK)
on:
  push:
    branches: [feat/creation-score-separate-delete-20261103]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  creation-deletion-basic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: PianoLivreAndroid
    steps:
      - uses: actions/checkout@v4
      - name: Verify public source and targeted Python contracts
        run: |
          python3 scripts/verify_public_snapshot.py
          python3 tests/test_creation_score_deletion_contract.py
          python3 tests/test_library_removal_contract.py
          python3 tests/test_creation_library_contract.py
          python3 tests/test_creation_responsive_contract.py
          python3 -m py_compile tests/emulator_ui.py tests/c2_d_ui_smoke.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: JVM-only deletion and crash recovery
        run: |
          mkdir -p build/creation-deletion
          javac -encoding UTF-8 -d build/creation-deletion app/src/main/java/br/org/pianolivre/CreationScoreDeletion.java tests/CreationScoreDeletionTest.java
          java -cp build/creation-deletion CreationScoreDeletionTest
          javac -encoding UTF-8 -d build/creation-deletion app/src/main/java/br/org/pianolivre/SessionFiles.java app/src/main/java/br/org/pianolivre/ImportedScoreDeletion.java tests/ImportedScoreDeletionTest.java
          java -cp build/creation-deletion ImportedScoreDeletionTest
      - name: Compile Android Java without APK
        run: gradle --no-daemon :app:compileDebugJavaWithJavac
      - name: Assert no APK generated
        run: |
          test ! -e app/build/outputs/apk/debug/app-debug.apk
          test ! -e app/build/outputs/apk/release/app-release.apk
          echo CREATION_DELETION_NO_APK_PASS
