name: Piano Livre ZAi - ZAI-011 ajuste vertical de telas
on:
  push:
    branches:
      - zai/fix/zai011-altura-telas-adaptativa-20261111
  pull_request:
    branches:
      - zai/lab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  teste-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: PianoLivreAndroid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Preparar Android SDK 36
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Auditorar código aberto e contratos de navegação/MIDI
        run: |
          set -euo pipefail
          python3 scripts/verify_public_snapshot.py
          python3 tests/test_zai010_dashboard_contract.py
          python3 tests/test_zai011_vertical_layout_contract.py
          python3 tests/test_creation_responsive_contract.py
          python3 tests/test_creation_library_contract.py
          python3 tests/test_creation_score_deletion_contract.py
      - name: Validar medidas de viewport em JVM pura
        run: |
          set -euo pipefail
          mkdir -p build/zai-011-layout
          javac -encoding UTF-8 -d build/zai-011-layout \
            app/src/main/java/br/org/pianolivre/ZaiAdaptiveHeights.java \
            tests/ZaiAdaptiveHeightsTest.java
          java -cp build/zai-011-layout br.org.pianolivre.ZaiAdaptiveHeightsTest
      - name: Compilar Android debug isolado sem assinatura de distribuição
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug -Ppianolivre.zai.test=true
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk > build/zai-011-metadata.txt
          grep -Fq "package: name='br.org.pianolivre.opensource.zai'" build/zai-011-metadata.txt
          echo ZAI011_ANDROID_BUILD_PASS
