name: Open Piano Livre - tests and APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/tela-inicial-piano-livre, feat/tela-estudar-piano-livre]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: PianoLivreAndroid
    steps:
      - uses: actions/checkout@v4
      - name: Verify safe public assets, license, and isolated Android app
        run: python3 scripts/verify_public_snapshot.py
      - name: Verify conservative V1 risk classification
        run: python3 -m unittest discover -s tests -p test_classify_pr_risk.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Adaptive Study profile and complete corpus (desktop Chromium)
        env:
          PIANO_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node tests/StudyProfileTest.js
          node tests/StudyWindowTest.js
          mkdir -p build/score-tests
          javac -d build/score-tests app/src/main/java/br/org/pianolivre/Score.java tests/StudyProfileCorpus.java
          java -cp build/score-tests StudyProfileCorpus > build/study-corpus.tsv
          gradle --no-daemon :app:prepareOfflineNotation
          npm install --prefix build/study-browser --no-audit --no-fund playwright@1.49.1
          build/study-browser/node_modules/.bin/playwright install --with-deps chromium
          PIANO_PLAYWRIGHT="$PWD/build/study-browser/node_modules/playwright" node tests/StudyProfileBrowserTest.js
          PIANO_PLAYWRIGHT="$PWD/build/study-browser/node_modules/playwright" node tests/TemporalNoteTipBrowserTest.js
          javac -encoding UTF-8 -d build/score-tests app/src/main/java/br/org/pianolivre/DiscoveryScoreBuilder.java tests/DiscoveryNotationFixtures.java
          java -cp build/score-tests br.org.pianolivre.DiscoveryNotationFixtures > build/discovery-fixtures.txt
          PIANO_PLAYWRIGHT="$PWD/build/study-browser/node_modules/playwright" node tests/DiscoveryNotationBrowserTest.js
          PIANO_PLAYWRIGHT="$PWD/build/study-browser/node_modules/playwright" node tests/DiscoveryEBaselineBrowserTest.js
          PIANO_PLAYWRIGHT="$PWD/build/study-browser/node_modules/playwright" node tests/DiscoveryEVisualBrowserTest.js
          PIANO_PLAYWRIGHT="$PWD/build/study-browser/node_modules/playwright" node tests/DiscoveryEReversibleBrowserTest.js
      - name: Save adaptive Study measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-study-corpus
          path: docs/evidence/study-profile/
      - name: Preserve E-A baseline browser screenshots and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: implementacao-e-baseline-browser
          retention-days: 14
          path: PianoLivreAndroid/build/implementacao-e-baseline/browser/
          if-no-files-found: warn
      - name: Preserve E-B visual screenshots and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: implementacao-e-visual-eb
          retention-days: 14
          path: PianoLivreAndroid/build/implementacao-e-baseline/visual-eb/
          if-no-files-found: warn
      - name: Preserve E-C camera-transition visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: implementacao-e-visual-ec
          retention-days: 14
          path: PianoLivreAndroid/build/implementacao-e-baseline/visual-ec/
          if-no-files-found: warn
      - name: Task 06 exact source and native fidelity
        run: |
          python3 tests/complex_notation_source_test.py
          mkdir -p build/score-tests
          javac -d build/score-tests app/src/main/java/br/org/pianolivre/Score.java tests/ComplexNotationFidelityTest.java
          java -cp build/score-tests ComplexNotationFidelityTest
      - name: Test MusicXML library (JVM)
        run: |
          mkdir -p build/score-tests
          javac -d build/score-tests app/src/main/java/br/org/pianolivre/Score.java tests/ScoreSmokeTest.java
          java -cp build/score-tests ScoreSmokeTest
          javac -cp build/score-tests -d build/score-tests tests/PolyphonyFidelityTest.java
          java -cp build/score-tests PolyphonyFidelityTest
          javac -cp build/score-tests -d build/score-tests app/src/main/java/br/org/pianolivre/ScoreImport.java tests/ScoreImportTest.java
          java -Xmx512m -cp build/score-tests ScoreImportTest
          javac -cp build/score-tests -d build/score-tests app/src/main/java/br/org/pianolivre/MidiFileImport.java app/src/main/java/br/org/pianolivre/MidiImportStorage.java tests/MidiFileImportTest.java
          java -Xmx512m -cp build/score-tests MidiFileImportTest
          javac -cp build/score-tests -d build/score-tests tests/TempoMapTest.java
          java -cp build/score-tests TempoMapTest
          javac -cp build/score-tests -d build/score-tests app/src/main/java/br/org/pianolivre/RepeatNavigator.java tests/RepeatNavigatorTest.java tests/MusicStructureTest.java
          java -cp build/score-tests RepeatNavigatorTest
          javac -cp build/score-tests -d build/score-tests app/src/main/java/br/org/pianolivre/PerformanceRoute.java tests/PerformanceRouteTest.java
          java -cp build/score-tests PerformanceRouteTest
          javac -cp build/score-tests -d build/score-tests app/src/main/java/br/org/pianolivre/MidiPlayback.java app/src/main/java/br/org/pianolivre/KeyboardGuide.java tests/PerformanceRoutePlaybackTest.java
          java -cp build/score-tests PerformanceRoutePlaybackTest
          java -cp build/score-tests MusicStructureTest
          javac -cp build/score-tests -d build/score-tests app/src/main/java/br/org/pianolivre/MidiProtocol.java app/src/main/java/br/org/pianolivre/MidiPlayback.java tests/MidiSmokeTest.java
          java -cp build/score-tests MidiSmokeTest
          javac -cp build/score-tests -d build/score-tests app/src/main/java/br/org/pianolivre/WaitRecognizer.java app/src/main/java/br/org/pianolivre/HandNavigation.java tests/WaitRecognizerTest.java
          java -cp build/score-tests WaitRecognizerTest
          javac -cp build/score-tests -d build/score-tests app/src/main/java/br/org/pianolivre/ChordCalibration.java tests/ChordCalibrationTest.java
          java -cp build/score-tests ChordCalibrationTest
          javac -cp build/score-tests -d build/score-tests app/src/main/java/br/org/pianolivre/MidiPerformance.java tests/MidiPerformanceTest.java
          java -cp build/score-tests MidiPerformanceTest
          javac -cp build/score-tests -d build/score-tests tests/MidiChannelModeTest.java
          java -cp build/score-tests MidiChannelModeTest
          javac -cp build/score-tests -d build/score-tests app/src/main/java/br/org/pianolivre/KeyboardGuide.java tests/KeyboardGuideTest.java
          java -cp build/score-tests KeyboardGuideTest
          javac -cp build/score-tests -d build/score-tests tests/KeyboardGuideLoadTest.java
          java -Xmx512m -cp build/score-tests KeyboardGuideLoadTest
          javac -cp build/score-tests -d build/score-tests tests/MusicTimelineConsistencyTest.java
          java -cp build/score-tests MusicTimelineConsistencyTest
      - name: End-to-end musical Study journeys on short and long scores (JVM)
        run: |
          javac -cp build/score-tests -d build/score-tests \
            app/src/main/java/br/org/pianolivre/WaitPreparation.java \
            app/src/main/java/br/org/pianolivre/WaitRecognizer.java \
            app/src/main/java/br/org/pianolivre/KeyboardGuide.java \
            app/src/main/java/br/org/pianolivre/MidiPlayback.java \
            tests/StudySessionIntegrationTest.java
          java -Xmx512m -cp build/score-tests StudySessionIntegrationTest
      - name: Music-aligned A-B loop markers (JVM)
        run: |
          javac -cp build/score-tests -d build/score-tests app/src/main/java/br/org/pianolivre/StudyLoopPosition.java tests/StudyLoopPositionTest.java
          java -cp build/score-tests StudyLoopPositionTest
      - name: Test Laboratory music theory (JVM)
        run: |
          javac -d build/score-tests app/src/main/java/br/org/pianolivre/MusicTheory.java tests/MusicTheoryTest.java
          java -cp build/score-tests MusicTheoryTest
      - name: Test trusted beta publication gates (Python)
        run: |
          python3 tests/PublishBetaTest.py
          python3 tests/SharedDebugApkTest.py
          python3 tests/EmulatorGateTest.py
      - name: Test Espera preparation timing (JVM)
        run: |
          javac -d build/score-tests app/src/main/java/br/org/pianolivre/WaitPreparation.java tests/WaitPreparationTest.java
          java -cp build/score-tests WaitPreparationTest
      - name: Test study information display cadence (JVM)
        run: |
          javac -d build/score-tests app/src/main/java/br/org/pianolivre/StudyInfoText.java tests/StudyInfoTextTest.java
          java -cp build/score-tests StudyInfoTextTest
      - name: Test local library search (JVM)
        run: |
          javac -d build/score-tests app/src/main/java/br/org/pianolivre/LibrarySearch.java tests/LibrarySearchTest.java
          java -cp build/score-tests LibrarySearchTest
      - name: Test home MIDI indicator labels (JVM)
        run: |
          javac -d build/score-tests app/src/main/java/br/org/pianolivre/HomeMidiIndicator.java tests/HomeMidiIndicatorTest.java
          java -cp build/score-tests HomeMidiIndicatorTest
      - name: Test Study chrome presentation transitions (JVM)
        run: |
          javac -d build/score-tests app/src/main/java/br/org/pianolivre/StudyChromeState.java tests/StudyChromeStateTest.java
          java -cp build/score-tests StudyChromeStateTest
      - name: Test shared MIDI connection lifecycle and async races (JVM)
        run: |
          javac -d build/score-tests app/src/main/java/br/org/pianolivre/MidiConnection.java app/src/main/java/br/org/pianolivre/HomeMidiIndicator.java tests/MidiConnectionTest.java
          java -cp build/score-tests MidiConnectionTest
          javac -d build/score-tests app/src/main/java/br/org/pianolivre/MidiProtocol.java tests/MidiProtocolEpochTest.java
          java -cp build/score-tests MidiProtocolEpochTest
          javac -d build/score-tests app/src/main/java/br/org/pianolivre/MidiTakeRecorder.java tests/MidiTakeRecorderTest.java
          java -cp build/score-tests MidiTakeRecorderTest
          javac -d build/score-tests app/src/main/java/br/org/pianolivre/MidiTakeRecorder.java app/src/main/java/br/org/pianolivre/CreationProjectStore.java tests/CreationProjectStoreTest.java
          java -cp build/score-tests CreationProjectStoreTest
          javac -cp build/score-tests -d build/score-tests app/src/main/java/br/org/pianolivre/Score.java app/src/main/java/br/org/pianolivre/MidiFileImport.java app/src/main/java/br/org/pianolivre/MidiTakeRecorder.java app/src/main/java/br/org/pianolivre/CreationProjectStore.java app/src/main/java/br/org/pianolivre/MidiStandardFileWriter.java tests/MidiStandardFileWriterTest.java
          java -cp build/score-tests MidiStandardFileWriterTest
          javac -cp build/score-tests -d build/score-tests app/src/main/java/br/org/pianolivre/MidiTakeRecorder.java app/src/main/java/br/org/pianolivre/CreationProjectStore.java app/src/main/java/br/org/pianolivre/MidiStandardFileWriter.java app/src/main/java/br/org/pianolivre/MidiTakePlayer.java tests/MidiTakePlayerTest.java
          java -cp build/score-tests MidiTakePlayerTest
          javac -cp build/score-tests -d build/score-tests app/src/main/java/br/org/pianolivre/MidiTakeRecorder.java app/src/main/java/br/org/pianolivre/CreationProjectStore.java app/src/main/java/br/org/pianolivre/CreationJournal.java tests/CreationJournalTest.java
          java -cp build/score-tests CreationJournalTest
          javac -encoding UTF-8 -cp build/score-tests -d build/score-tests tests/CreationSafetyRegressionTest.java
          java -cp build/score-tests br.org.pianolivre.CreationSafetyRegressionTest
          javac -encoding UTF-8 -cp build/score-tests -d build/score-tests tests/CreationLimitsTest.java
          java -Xmx128m -cp build/score-tests br.org.pianolivre.CreationLimitsTest
      - name: Test Laboratory scale and arpeggio sequences (JVM)
        run: |
          javac -d build/score-tests app/src/main/java/br/org/pianolivre/MusicTheory.java app/src/main/java/br/org/pianolivre/MusicSequenceAnalyzer.java tests/MusicSequenceAnalyzerTest.java
          java -cp build/score-tests MusicSequenceAnalyzerTest
      - name: Test spontaneous Laboratory pattern tracking (JVM)
        run: |
          javac -d build/score-tests app/src/main/java/br/org/pianolivre/MusicTheory.java app/src/main/java/br/org/pianolivre/MusicSequenceAnalyzer.java app/src/main/java/br/org/pianolivre/MusicPatternTracker.java tests/MusicPatternTrackerTest.java
          java -cp build/score-tests MusicPatternTrackerTest
      - name: Test reversible Descobrir framing selection (JVM)
        run: |
          mkdir -p build/score-tests
          javac -d build/score-tests app/src/main/java/br/org/pianolivre/DiscoveryFraming.java tests/DiscoveryFramingTest.java
          java -cp build/score-tests br.org.pianolivre.DiscoveryFramingTest
      - name: Test Descobrir MusicXML engraving source (JVM)
        run: |
          javac -d build/score-tests app/src/main/java/br/org/pianolivre/Score.java app/src/main/java/br/org/pianolivre/DiscoveryScoreBuilder.java tests/DiscoveryScoreBuilderTest.java
          java -cp build/score-tests br.org.pianolivre.DiscoveryScoreBuilderTest
      - name: Test MIDI discovery state and persistence (JVM)
        run: |
          javac -d build/score-tests app/src/main/java/br/org/pianolivre/MusicTheory.java app/src/main/java/br/org/pianolivre/MusicNoteSpelling.java app/src/main/java/br/org/pianolivre/MusicSequenceAnalyzer.java app/src/main/java/br/org/pianolivre/MusicPatternTracker.java app/src/main/java/br/org/pianolivre/MusicDiscoverySession.java tests/MusicDiscoverySessionTest.java
          java -cp build/score-tests MusicDiscoverySessionTest
      - name: Test searchable local Laboratory catalog (JVM)
        run: |
          javac -d build/score-tests app/src/main/java/br/org/pianolivre/MusicTheory.java app/src/main/java/br/org/pianolivre/MusicLabCatalog.java tests/MusicLabCatalogTest.java
          java -cp build/score-tests MusicLabCatalogTest
      - name: Test USB-MIDI Laboratory demonstration lifecycle (JVM)
        run: |
          javac -d build/score-tests app/src/main/java/br/org/pianolivre/MusicLabPlaybackPlan.java tests/MusicLabPlaybackPlanTest.java
          java -cp build/score-tests MusicLabPlaybackPlanTest
      - name: Test ordered Laboratory scale and arpeggio practice (JVM)
        run: |
          javac -d build/score-tests app/src/main/java/br/org/pianolivre/MusicLabPracticeSequence.java tests/MusicLabPracticeSequenceTest.java
          java -cp build/score-tests MusicLabPracticeSequenceTest
      - name: Test responsive compact library grid (JVM)
        run: |
          javac -d build/score-tests app/src/main/java/br/org/pianolivre/LibraryGridLayout.java tests/LibraryGridLayoutTest.java
          java -cp build/score-tests LibraryGridLayoutTest
      - name: Test portable sessions and JSON limits (JVM)
        run: |
          mkdir -p build/score-tests
          javac -d build/score-tests app/src/main/java/br/org/pianolivre/JsonLimits.java app/src/main/java/br/org/pianolivre/SessionFiles.java app/src/main/java/br/org/pianolivre/SessionPreferences.java tests/SessionCompatibilityTest.java
          java -cp build/score-tests SessionCompatibilityTest
      - name: Test foreground study timer (JVM)
        run: |
          javac -d build/score-tests app/src/main/java/br/org/pianolivre/StudyClock.java tests/StudyClockTest.java
          java -cp build/score-tests StudyClockTest
      - name: Test isolated OSMD engraving research path (JavaScript)
        run: |
          node tests/EngravingProofContractTest.js
          node tests/VerticalNavigationTest.js
          node tests/OpticalTimeMapTest.js
          node tests/StudyLoopTransportContractTest.js
          node tests/StudyNoteTipTest.js
          node --check app/src/main/assets/study-note-tip.js
          node tests/PolyphonyFidelityTest.js
          node tests/EnharmonicReconciliationTest.js
          node tests/AccidentalConventionsTest.js
          node --check app/src/main/assets/optical-time-map.js
      - name: Test proportional score layout (JavaScript)
        run: |
          node --check app/src/main/assets/temporal-notation.js
          node tests/TemporalLayoutTest.js
          node tests/ClefEngravingTest.js
          node tests/NotationSpannersTest.js
          node tests/NotationAdvancedTest.js
          node tests/NotationOrnamentsTest.js
      - name: Cross-check MusicXML Java model vs JavaScript score renderer
        run: |
          javac -cp build/score-tests -d build/score-tests tests/ScoreInventory.java
          mkdir -p build/musicxml-audit
          npm install --prefix build/musicxml-audit --no-save --silent '@xmldom/xmldom@0.9.8'
          node tests/musicxml_visual_crosscheck.js
          node tests/TemporalRenderingTest.js
          node tests/NoteIdentificationTest.js
          javac -cp build/score-tests -d build/score-tests tests/MusicXmlFixtureInventory.java
          node tests/MusicXmlFixturesTest.js
          javac -cp build/score-tests -d build/score-tests tests/MusicXmlDynamicsTest.java
          java -cp build/score-tests MusicXmlDynamicsTest
          javac -cp build/score-tests -d build/score-tests tests/KeyboardExpressionTest.java
          java -cp build/score-tests KeyboardExpressionTest
      - name: Audit MIDI recognition over the public MusicXML corpus
        run: |
          mkdir -p build/recognition-tests
          javac -d build/recognition-tests app/src/main/java/br/org/pianolivre/Score.java app/src/main/java/br/org/pianolivre/MidiProtocol.java app/src/main/java/br/org/pianolivre/MidiPlayback.java app/src/main/java/br/org/pianolivre/WaitRecognizer.java app/src/main/java/br/org/pianolivre/HandNavigation.java tests/RecognitionAudit.java
          java -cp build/recognition-tests RecognitionAudit
          python3 tests/recognition_corpus_audit.py
      - name: Configure stable public-beta signing (trusted pushes only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          PUBLIC_KEYSTORE_B64: ${{ secrets.PIANOLIVRE_PUBLIC_KEYSTORE_BASE64 }}
          PUBLIC_STORE_PASSWORD: ${{ secrets.PIANOLIVRE_PUBLIC_STORE_PASSWORD }}
          PUBLIC_KEY_ALIAS: ${{ secrets.PIANOLIVRE_PUBLIC_KEY_ALIAS }}
          PUBLIC_KEY_PASSWORD: ${{ secrets.PIANOLIVRE_PUBLIC_KEY_PASSWORD }}
        run: |
          if [ -n "${PUBLIC_KEYSTORE_B64:-}" ]; then
            test -n "$PUBLIC_STORE_PASSWORD"
            test -n "$PUBLIC_KEY_ALIAS"
            test -n "$PUBLIC_KEY_PASSWORD"
            keypath="$RUNNER_TEMP/pianolivre-open-beta.jks"
            printf '%s' "$PUBLIC_KEYSTORE_B64" | base64 --decode > "$keypath"
            chmod 600 "$keypath"
            echo "PIANOLIVRE_PUBLIC_KEYSTORE_FILE=$keypath" >> "$GITHUB_ENV"
            echo "PIANOLIVRE_PUBLIC_STORE_PASSWORD=$PUBLIC_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "PIANOLIVRE_PUBLIC_KEY_ALIAS=$PUBLIC_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "PIANOLIVRE_PUBLIC_KEY_PASSWORD=$PUBLIC_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "STABLE_PUBLIC_BETA_SIGNING_CONFIGURED"
          elif [ -n "${PUBLIC_STORE_PASSWORD:-}" ] || [ -n "${PUBLIC_KEY_ALIAS:-}" ] || [ -n "${PUBLIC_KEY_PASSWORD:-}" ]; then
            echo "::error::Incomplete public-beta signing secrets" >&2
            exit 1
          else
            echo "::error::Stable public signing is required on main; no APK will be distributed with an ephemeral key" >&2
            exit 1
          fi
      - name: Compile versioned debug APK directly from Gradle properties
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Verify isolated non-debuggable distribution APK
        run: |
          for variant in debug release; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "app/build/outputs/apk/$variant/app-$variant.apk" | tee "build/public-$variant-signature.txt"
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "app/build/outputs/apk/$variant/app-$variant.apk" | tee "build/public-$variant-apk-metadata.txt"
          done
          cp build/public-release-signature.txt build/public-signature.txt
          cp build/public-release-apk-metadata.txt build/public-apk-metadata.txt
          grep 'Signer #1 certificate SHA-256 digest:' build/public-debug-signature.txt > build/debug-cert.txt
          grep 'Signer #1 certificate SHA-256 digest:' build/public-release-signature.txt > build/release-cert.txt
          cmp build/debug-cert.txt build/release-cert.txt
          if grep -q '^application-debuggable' build/public-apk-metadata.txt; then echo '::error::Distribution APK must not be debuggable'; exit 1; fi
          if grep -q 'android.permission.INTERNET' build/public-apk-metadata.txt; then echo '::error::Offline app must not request INTERNET'; exit 1; fi
          version_code=$(sed -n 's/^pianolivre.beta.versionCode=//p' gradle.properties)
          version_name=$(sed -n 's/^pianolivre.beta.versionName=//p' gradle.properties)
          test -n "$version_code" && test -n "$version_name"
          grep -Fq "package: name='br.org.pianolivre.opensource' versionCode='$version_code' versionName='$version_name'" build/public-apk-metadata.txt
          test ! -e ../DO_NOT_PUBLISH_OWNER_SCORES.txt
          if [ "$GITHUB_EVENT_NAME" != 'pull_request' ] && [ "$GITHUB_REF" = 'refs/heads/main' ]; then
            grep -Fq 'Signer #1 certificate SHA-256 digest: 7bf1e9fa2d6cf1468463a2990e0a0699acc7c5efac45a77070c4d084e7798290' build/public-signature.txt
          fi
          echo PUBLIC_DISTRIBUTION_APK_PASS
      - name: Upload signed public distribution APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && success()
        uses: actions/upload-artifact@v4
        with:
          name: PianoLivre-open-release-apk
          path: |
            PianoLivreAndroid/app/build/outputs/apk/release/app-release.apk
            PianoLivreAndroid/build/public-signature.txt
            PianoLivreAndroid/build/public-apk-metadata.txt
          if-no-files-found: error
          retention-days: 30

  public-beta:
    needs: build
    # One-time, version-scoped release authorized by the maintainer; never on PRs.
    # Exact-version authorization and build/emulator gates remain enforced by the publisher.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-0.9.58]')))
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: write
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/download-artifact@v4
        with:
          name: PianoLivre-open-release-apk
          path: dist
      - name: Publish durable beta after exact-commit checks
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
        run: python3 PianoLivreAndroid/scripts/publish_public_beta.py
