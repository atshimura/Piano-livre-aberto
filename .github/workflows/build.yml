name: Open Piano Livre - tests and APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: PianoLivreAndroid
    steps:
      - uses: actions/checkout@v4
      - name: Verify safe public assets, license, and isolated Android app
        run: python3 scripts/verify_public_snapshot.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test MusicXML library (JVM)
        run: |
          mkdir -p build/score-tests
          javac -d build/score-tests app/src/main/java/br/org/pianolivre/Score.java tests/ScoreSmokeTest.java
          java -cp build/score-tests ScoreSmokeTest
          javac -cp build/score-tests -d build/score-tests app/src/main/java/br/org/pianolivre/ScoreImport.java tests/ScoreImportTest.java
          java -Xmx512m -cp build/score-tests ScoreImportTest
          javac -cp build/score-tests -d build/score-tests app/src/main/java/br/org/pianolivre/MidiFileImport.java app/src/main/java/br/org/pianolivre/MidiImportStorage.java tests/MidiFileImportTest.java
          java -Xmx512m -cp build/score-tests MidiFileImportTest
          javac -cp build/score-tests -d build/score-tests tests/TempoMapTest.java
          java -cp build/score-tests TempoMapTest
          javac -cp build/score-tests -d build/score-tests app/src/main/java/br/org/pianolivre/RepeatNavigator.java tests/RepeatNavigatorTest.java tests/MusicStructureTest.java
          java -cp build/score-tests RepeatNavigatorTest
          javac -cp build/score-tests -d build/score-tests app/src/main/java/br/org/pianolivre/PerformanceRoute.java tests/PerformanceRouteTest.java
          java -cp build/score-tests PerformanceRouteTest
          javac -cp build/score-tests -d build/score-tests app/src/main/java/br/org/pianolivre/MidiPlayback.java app/src/main/java/br/org/pianolivre/KeyboardGuide.java tests/PerformanceRoutePlaybackTest.java
          java -cp build/score-tests PerformanceRoutePlaybackTest
          java -cp build/score-tests MusicStructureTest
          javac -cp build/score-tests -d build/score-tests app/src/main/java/br/org/pianolivre/MidiProtocol.java app/src/main/java/br/org/pianolivre/MidiPlayback.java tests/MidiSmokeTest.java
          java -cp build/score-tests MidiSmokeTest
          javac -cp build/score-tests -d build/score-tests app/src/main/java/br/org/pianolivre/WaitRecognizer.java app/src/main/java/br/org/pianolivre/HandNavigation.java tests/WaitRecognizerTest.java
          java -cp build/score-tests WaitRecognizerTest
          javac -cp build/score-tests -d build/score-tests app/src/main/java/br/org/pianolivre/ChordCalibration.java tests/ChordCalibrationTest.java
          java -cp build/score-tests ChordCalibrationTest
          javac -cp build/score-tests -d build/score-tests app/src/main/java/br/org/pianolivre/MidiPerformance.java tests/MidiPerformanceTest.java
          java -cp build/score-tests MidiPerformanceTest
          javac -cp build/score-tests -d build/score-tests tests/MidiChannelModeTest.java
          java -cp build/score-tests MidiChannelModeTest
          javac -cp build/score-tests -d build/score-tests app/src/main/java/br/org/pianolivre/KeyboardGuide.java tests/KeyboardGuideTest.java
          java -cp build/score-tests KeyboardGuideTest
          javac -cp build/score-tests -d build/score-tests tests/KeyboardGuideLoadTest.java
          java -Xmx512m -cp build/score-tests KeyboardGuideLoadTest
          javac -cp build/score-tests -d build/score-tests tests/MusicTimelineConsistencyTest.java
          java -cp build/score-tests MusicTimelineConsistencyTest
      - name: Test Laboratory music theory (JVM)
        run: |
          javac -d build/score-tests app/src/main/java/br/org/pianolivre/MusicTheory.java tests/MusicTheoryTest.java
          java -cp build/score-tests MusicTheoryTest
      - name: Test trusted beta publication gates (Python)
        run: python3 tests/PublishBetaTest.py
      - name: Test Espera preparation timing (JVM)
        run: |
          javac -d build/score-tests app/src/main/java/br/org/pianolivre/WaitPreparation.java tests/WaitPreparationTest.java
          java -cp build/score-tests WaitPreparationTest
      - name: Test study information display cadence (JVM)
        run: |
          javac -d build/score-tests app/src/main/java/br/org/pianolivre/StudyInfoText.java tests/StudyInfoTextTest.java
          java -cp build/score-tests StudyInfoTextTest
      - name: Test local library search (JVM)
        run: |
          javac -d build/score-tests app/src/main/java/br/org/pianolivre/LibrarySearch.java tests/LibrarySearchTest.java
          java -cp build/score-tests LibrarySearchTest
      - name: Test Laboratory scale and arpeggio sequences (JVM)
        run: |
          javac -d build/score-tests app/src/main/java/br/org/pianolivre/MusicTheory.java app/src/main/java/br/org/pianolivre/MusicSequenceAnalyzer.java tests/MusicSequenceAnalyzerTest.java
          java -cp build/score-tests MusicSequenceAnalyzerTest
      - name: Test responsive compact library grid (JVM)
        run: |
          javac -d build/score-tests app/src/main/java/br/org/pianolivre/LibraryGridLayout.java tests/LibraryGridLayoutTest.java
          java -cp build/score-tests LibraryGridLayoutTest
      - name: Test portable sessions and JSON limits (JVM)
        run: |
          mkdir -p build/score-tests
          javac -d build/score-tests app/src/main/java/br/org/pianolivre/JsonLimits.java app/src/main/java/br/org/pianolivre/SessionFiles.java app/src/main/java/br/org/pianolivre/SessionPreferences.java tests/SessionCompatibilityTest.java
          java -cp build/score-tests SessionCompatibilityTest
      - name: Test foreground study timer (JVM)
        run: |
          javac -d build/score-tests app/src/main/java/br/org/pianolivre/StudyClock.java tests/StudyClockTest.java
          java -cp build/score-tests StudyClockTest
      - name: Test proportional score layout (JavaScript)
        run: |
          node --check app/src/main/assets/temporal-notation.js
          node tests/TemporalLayoutTest.js
          node tests/ClefEngravingTest.js
          node tests/NotationSpannersTest.js
          node tests/NotationAdvancedTest.js
          node tests/NotationOrnamentsTest.js
      - name: Cross-check MusicXML Java model vs JavaScript score renderer
        run: |
          javac -cp build/score-tests -d build/score-tests tests/ScoreInventory.java
          mkdir -p build/musicxml-audit
          npm install --prefix build/musicxml-audit --no-save --silent '@xmldom/xmldom@0.9.8'
          node tests/musicxml_visual_crosscheck.js
          node tests/TemporalRenderingTest.js
          node tests/NoteIdentificationTest.js
          javac -cp build/score-tests -d build/score-tests tests/MusicXmlFixtureInventory.java
          node tests/MusicXmlFixturesTest.js
          javac -cp build/score-tests -d build/score-tests tests/MusicXmlDynamicsTest.java
          java -cp build/score-tests MusicXmlDynamicsTest
          javac -cp build/score-tests -d build/score-tests tests/KeyboardExpressionTest.java
          java -cp build/score-tests KeyboardExpressionTest
      - name: Audit MIDI recognition over the public MusicXML corpus
        run: |
          mkdir -p build/recognition-tests
          javac -d build/recognition-tests app/src/main/java/br/org/pianolivre/Score.java app/src/main/java/br/org/pianolivre/MidiProtocol.java app/src/main/java/br/org/pianolivre/MidiPlayback.java app/src/main/java/br/org/pianolivre/WaitRecognizer.java app/src/main/java/br/org/pianolivre/HandNavigation.java tests/RecognitionAudit.java
          java -cp build/recognition-tests RecognitionAudit
          python3 tests/recognition_corpus_audit.py
      - name: Configure stable public-beta signing (trusted pushes only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          PUBLIC_KEYSTORE_B64: ${{ secrets.PIANOLIVRE_PUBLIC_KEYSTORE_BASE64 }}
          PUBLIC_STORE_PASSWORD: ${{ secrets.PIANOLIVRE_PUBLIC_STORE_PASSWORD }}
          PUBLIC_KEY_ALIAS: ${{ secrets.PIANOLIVRE_PUBLIC_KEY_ALIAS }}
          PUBLIC_KEY_PASSWORD: ${{ secrets.PIANOLIVRE_PUBLIC_KEY_PASSWORD }}
        run: |
          if [ -n "${PUBLIC_KEYSTORE_B64:-}" ]; then
            test -n "$PUBLIC_STORE_PASSWORD"
            test -n "$PUBLIC_KEY_ALIAS"
            test -n "$PUBLIC_KEY_PASSWORD"
            keypath="$RUNNER_TEMP/pianolivre-open-beta.jks"
            printf '%s' "$PUBLIC_KEYSTORE_B64" | base64 --decode > "$keypath"
            chmod 600 "$keypath"
            echo "PIANOLIVRE_PUBLIC_KEYSTORE_FILE=$keypath" >> "$GITHUB_ENV"
            echo "PIANOLIVRE_PUBLIC_STORE_PASSWORD=$PUBLIC_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "PIANOLIVRE_PUBLIC_KEY_ALIAS=$PUBLIC_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "PIANOLIVRE_PUBLIC_KEY_PASSWORD=$PUBLIC_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "STABLE_PUBLIC_BETA_SIGNING_CONFIGURED"
          elif [ -n "${PUBLIC_STORE_PASSWORD:-}" ] || [ -n "${PUBLIC_KEY_ALIAS:-}" ] || [ -n "${PUBLIC_KEY_PASSWORD:-}" ]; then
            echo "::error::Incomplete public-beta signing secrets" >&2
            exit 1
          else
            echo "::error::Stable public signing is required on main; no APK will be distributed with an ephemeral key" >&2
            exit 1
          fi
      - name: Compile versioned debug APK directly from Gradle properties
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Verify isolated non-debuggable distribution APK
        run: |
          for variant in debug release; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "app/build/outputs/apk/$variant/app-$variant.apk" | tee "build/public-$variant-signature.txt"
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "app/build/outputs/apk/$variant/app-$variant.apk" | tee "build/public-$variant-apk-metadata.txt"
          done
          cp build/public-release-signature.txt build/public-signature.txt
          cp build/public-release-apk-metadata.txt build/public-apk-metadata.txt
          grep 'Signer #1 certificate SHA-256 digest:' build/public-debug-signature.txt > build/debug-cert.txt
          grep 'Signer #1 certificate SHA-256 digest:' build/public-release-signature.txt > build/release-cert.txt
          cmp build/debug-cert.txt build/release-cert.txt
          if grep -q '^application-debuggable' build/public-apk-metadata.txt; then echo '::error::Distribution APK must not be debuggable'; exit 1; fi
          if grep -q 'android.permission.INTERNET' build/public-apk-metadata.txt; then echo '::error::Offline app must not request INTERNET'; exit 1; fi
          version_code=$(sed -n 's/^pianolivre.beta.versionCode=//p' gradle.properties)
          version_name=$(sed -n 's/^pianolivre.beta.versionName=//p' gradle.properties)
          test -n "$version_code" && test -n "$version_name"
          grep -Fq "package: name='br.org.pianolivre.opensource' versionCode='$version_code' versionName='$version_name'" build/public-apk-metadata.txt
          test ! -e ../DO_NOT_PUBLISH_OWNER_SCORES.txt
          if [ "$GITHUB_EVENT_NAME" != 'pull_request' ] && [ "$GITHUB_REF" = 'refs/heads/main' ]; then
            grep -Fq 'Signer #1 certificate SHA-256 digest: 7bf1e9fa2d6cf1468463a2990e0a0699acc7c5efac45a77070c4d084e7798290' build/public-signature.txt
          fi
          echo PUBLIC_DISTRIBUTION_APK_PASS
      - name: Upload signed public distribution APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && success()
        uses: actions/upload-artifact@v4
        with:
          name: PianoLivre-open-release-apk
          path: |
            PianoLivreAndroid/app/build/outputs/apk/release/app-release.apk
            PianoLivreAndroid/build/public-signature.txt
            PianoLivreAndroid/build/public-apk-metadata.txt
          if-no-files-found: error
          retention-days: 30

  public-beta:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/download-artifact@v4
        with:
          name: PianoLivre-open-release-apk
          path: dist
      - name: Publish durable beta after exact-commit checks
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
        run: python3 PianoLivreAndroid/scripts/publish_public_beta.py
