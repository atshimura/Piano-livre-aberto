name: Piano Livre - Dialogos de ajuste da partitura (basico)
on:
  push:
    branches: [fix/creation-score-dialog-scroll-20261103]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dialog-scroll-basic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: PianoLivreAndroid
    steps:
      - uses: actions/checkout@v4
      - name: Auditoria publica e contratos de Criação
        run: |
          python3 scripts/verify_public_snapshot.py
          python3 tests/test_creation_responsive_contract.py
          python3 tests/test_creation_rhythm_contract.py
          python3 tests/test_creation_library_contract.py
          python3 -m py_compile tests/c2_d_ui_smoke.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar Java Android sem APK e sem suite completa
        run: gradle --no-daemon :app:compileDebugJavaWithJavac
      - name: Confirmar que nao foi gerado APK
        run: |
          test ! -e app/build/outputs/apk/debug/app-debug.apk
          test ! -e app/build/outputs/apk/release/app-release.apk
          echo DIALOG_SCROLL_BASIC_NO_APK_PASS

  dialog-scroll-emulator:
    needs: [dialog-scroll-basic]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Habilitar KVM para teste dirigido
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_3
          disable-animations: true
          working-directory: PianoLivreAndroid
          script: |
            gradle --no-daemon :app:assembleDebug
            PIANO_DIALOG_SCROLL_ONLY=1 python3 tests/c2_d_ui_smoke.py
      - name: Evidencias de interface sintetica
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creation-dialog-scroll-phone
          retention-days: 7
          path: PianoLivreAndroid/build/c2-d-evidence/
          if-no-files-found: warn
