name: Piano Livre C2 - somente testes basicos
on:
  push:
    branches:
      - feat/criacao-c2-b-previa-ajustes
      - feat/criacao-c2-c-persistencia-backup-estudar
      - feat/criacao-c2-d-validacao-entrega

concurrency:
  group: c2-only-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  c2-basic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar SDK Android 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Testes JVM exclusivos do gerador de partituras (sem suite)
        working-directory: PianoLivreAndroid
        run: |
          mkdir -p build/c2-basic
          javac -encoding UTF-8 -d build/c2-basic \
            app/src/main/java/br/org/pianolivre/MidiTakeRecorder.java \
            app/src/main/java/br/org/pianolivre/ScoreMidiPairer.java \
            app/src/main/java/br/org/pianolivre/ScoreTempoEstimator.java \
            app/src/main/java/br/org/pianolivre/ScoreRhythmQuantizer.java \
            app/src/main/java/br/org/pianolivre/ScoreXmlComposer.java \
            app/src/main/java/br/org/pianolivre/CreationScoreGenerator.java \
            app/src/main/java/br/org/pianolivre/CreationProjectStore.java \
            app/src/main/java/br/org/pianolivre/CreationScoreStore.java \
            app/src/main/java/br/org/pianolivre/SessionFiles.java \
            app/src/main/java/br/org/pianolivre/Score.java \
            tests/ZScoreGeneratorRhythmTest.java \
            tests/ZScoreGeneratorXmlTest.java \
            tests/CreationScoreStoreTest.java \
            tests/CreationC2DCorpusTest.java
          java -cp build/c2-basic br.org.pianolivre.ZScoreGeneratorRhythmTest
          java -cp build/c2-basic br.org.pianolivre.ZScoreGeneratorXmlTest
          java -cp build/c2-basic br.org.pianolivre.CreationScoreStoreTest
          java -cp build/c2-basic br.org.pianolivre.CreationC2DCorpusTest
      - name: Contratos de interface da Criação
        working-directory: PianoLivreAndroid
        run: |
          python3 tests/test_creation_responsive_contract.py
          python3 tests/test_creation_score_deletion_contract.py
          python3 tests/test_creation_library_contract.py
      - name: Compilar apenas APK de depuracao (sem suite Android/emulador)
        working-directory: PianoLivreAndroid
        run: gradle --no-daemon :app:assembleDebug

  backup-smoke:
    if: contains(fromJSON('["refs/heads/feat/criacao-c2-c-persistencia-backup-estudar","refs/heads/feat/criacao-c2-d-validacao-entrega"]'), github.ref)
    needs: [c2-basic]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Habilitar KVM para um autoteste isolado
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_3
          disable-animations: true
          working-directory: PianoLivreAndroid
          script: |
            gradle --no-daemon :app:assembleDebug
            bash tests/c2_backup_smoke.sh

  c2-d-ui:
    if: github.ref == 'refs/heads/feat/criacao-c2-d-validacao-entrega'
    needs: [c2-basic]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        profile: [pixel_3, pixel_c]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar KVM para smoke C2-D
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          working-directory: PianoLivreAndroid
          script: |
            gradle --no-daemon :app:assembleDebug
            python3 tests/c2_d_ui_smoke.py
      - name: Evidências sintéticas de interface (sem dados do usuário)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c2-d-ui-${{ matrix.profile }}
          path: PianoLivreAndroid/build/c2-d-evidence/
          if-no-files-found: warn
          retention-days: 7
