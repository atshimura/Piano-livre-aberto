name: Piano Livre C2 - somente testes basicos
on:
  push:
    branches:
      - feat/criacao-c2-b-previa-ajustes
      - feat/criacao-c2-c-persistencia-backup-estudar

concurrency:
  group: c2-only-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  c2-basic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar SDK Android 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Testes JVM exclusivos C2-A e C2-B (sem suite)
        working-directory: PianoLivreAndroid
        run: |
          mkdir -p build/c2-basic
          javac -encoding UTF-8 -d build/c2-basic \
            app/src/main/java/br/org/pianolivre/MidiTakeRecorder.java \
            app/src/main/java/br/org/pianolivre/CreationScoreTranscriber.java \
            app/src/main/java/br/org/pianolivre/CreationScoreReview.java \
            app/src/main/java/br/org/pianolivre/CreationProjectStore.java \
            app/src/main/java/br/org/pianolivre/CreationScoreStore.java \
            app/src/main/java/br/org/pianolivre/SessionFiles.java \
            tests/CreationScoreTranscriberTest.java \
            tests/CreationScoreReviewTest.java \
            tests/CreationScoreStoreTest.java
          java -cp build/c2-basic br.org.pianolivre.CreationScoreTranscriberTest
          java -cp build/c2-basic br.org.pianolivre.CreationScoreReviewTest
          java -cp build/c2-basic br.org.pianolivre.CreationScoreStoreTest
      - name: Teste basico do toque na partitura
        working-directory: PianoLivreAndroid
        run: node tests/CreationNotePickerTest.js
      - name: Compilar apenas APK de depuracao (sem suite Android/emulador)
        working-directory: PianoLivreAndroid
        run: gradle --no-daemon :app:assembleDebug

  backup-smoke:
    if: github.ref == 'refs/heads/feat/criacao-c2-c-persistencia-backup-estudar'
    needs: [c2-basic]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Habilitar KVM para um autoteste isolado
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_3
          disable-animations: true
          working-directory: PianoLivreAndroid
          script: |
            gradle --no-daemon :app:assembleDebug
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n br.org.pianolivre.opensource/br.org.pianolivre.MainActivity --ez backup_selftest true
            mkdir -p build
            passed=0
            for attempt in $(seq 1 20); do
              adb logcat -d -s PianoLivreBackup:I AndroidRuntime:E '*:S' > build/c2-backup-smoke.log
              if grep -q 'BACKUP_SELFTEST_PASS assertions=' build/c2-backup-smoke.log; then passed=1; break; fi
              if grep -Eq 'BACKUP_SELFTEST_FAILED|FATAL EXCEPTION|Backup self-test failed' build/c2-backup-smoke.log; then
                cat build/c2-backup-smoke.log
                exit 1
              fi
              sleep 2
            done
            cat build/c2-backup-smoke.log
            test "$passed" = 1
