name: Piano Livre ZAi - ZAI-006 fidelidade S1 sem slurs
on:
  push:
    branches:
      - zai/feat/zai006-fidelidade-s1-sem-slur-20261110
  pull_request:
    branches:
      - zai/lab
  workflow_dispatch:
permissions:
  contents: read
jobs:
  teste-sem-assinatura:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: PianoLivreAndroid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Preparar SDK 36
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Auditoria de dados e contratos
        run: |
          set -euo pipefail
          python3 scripts/verify_public_snapshot.py
          python3 tests/test_creation_responsive_contract.py
          python3 tests/test_creation_score_deletion_contract.py
          python3 tests/test_creation_library_contract.py
          python3 tests/test_impl4_osmd_contract.py
          python3 tests/test_workflow_contract_audit.py
      - name: Testes JVM (ZAI-001, 002, 004 e S1 real ZAI-006)
        run: |
          set -euo pipefail
          mkdir -p build/zai-006
          javac -encoding UTF-8 -d build/zai-006 \
            app/src/main/java/br/org/pianolivre/MidiTakeRecorder.java \
            app/src/main/java/br/org/pianolivre/ScoreMidiPairer.java \
            app/src/main/java/br/org/pianolivre/ScoreTempoEstimator.java \
            app/src/main/java/br/org/pianolivre/ScoreRhythmQuantizer.java \
            app/src/main/java/br/org/pianolivre/ScoreXmlComposer.java \
            app/src/main/java/br/org/pianolivre/CreationScoreGenerator.java \
            app/src/main/java/br/org/pianolivre/CreationProjectStore.java \
            app/src/main/java/br/org/pianolivre/CreationScoreStore.java \
            app/src/main/java/br/org/pianolivre/SessionFiles.java \
            app/src/main/java/br/org/pianolivre/Score.java \
            tests/ZScoreGeneratorRhythmTest.java \
            tests/ZScoreGeneratorXmlTest.java \
            tests/CreationScoreStoreTest.java \
            tests/CreationC2DCorpusTest.java \
            tests/ZScoreRealMidiRegressionTest.java \
            app/src/main/java/br/org/pianolivre/DiscoveryScoreBuilder.java \
            tests/ZScoreChordFidelityRegressionTest.java \
            tests/ZScoreS1FidelityRegressionTest.java
          for test in ZScoreGeneratorRhythmTest ZScoreGeneratorXmlTest CreationScoreStoreTest CreationC2DCorpusTest ZScoreRealMidiRegressionTest ZScoreChordFidelityRegressionTest ZScoreS1FidelityRegressionTest; do
            java -cp build/zai-006 br.org.pianolivre."$test"
          done
      - name: Compilar pacote separado (debug provisório, sem distribuir)
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug -Ppianolivre.zai.test=true
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk > build/zai-006-debug-metadata.txt
          grep -Fq "package: name='br.org.pianolivre.opensource.zai'" build/zai-006-debug-metadata.txt
          grep -Fq "application-label:'Piano Livre ZAi'" build/zai-006-debug-metadata.txt
          if grep -Fq "package: name='br.org.pianolivre.opensource'" build/zai-006-debug-metadata.txt; then exit 1; fi
          echo ZAI006_ISOLATED_APPID_PASS
