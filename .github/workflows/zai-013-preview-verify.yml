name: Piano Livre ZAi - ZAI-013 prévia sem pauta encoberta, zoom no topo
on:
  push:
    branches:
      - zai/feat/zai013-previa-zoom-topo-pauta-final-20261111
  pull_request:
    branches:
      - zai/lab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes-score-viewport:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: PianoLivreAndroid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Preparar Android SDK 36
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Auditoria pública, persistência e contratos de interface
        run: |
          set -euo pipefail
          python3 scripts/verify_public_snapshot.py
          python3 tests/test_creation_responsive_contract.py
          python3 tests/test_zai008_layout_contract.py
          python3 tests/test_zai009_basic_contract.py
          python3 tests/test_zai010_dashboard_contract.py
          python3 tests/test_zai011_vertical_layout_contract.py
          python3 tests/test_zai012_content_viewport_contract.py
          python3 tests/test_zai013_score_preview_contract.py
          python3 tests/test_creation_score_deletion_contract.py
          python3 tests/test_creation_library_contract.py
      - name: Compilar APK debug separado, sem chave de distribuição
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug -Ppianolivre.zai.test=true
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk > build/zai-013-metadata.txt
          grep -Fq "package: name='br.org.pianolivre.opensource.zai'" build/zai-013-metadata.txt
          echo ZAI013_ANDROID_DEBUG_BUILD_PASS
      - name: Testar OSMD real em Chromium, inclusive último sistema após zoom
        run: |
          set -euo pipefail
          npm install --prefix build/zai013-browser --no-audit --no-fund playwright@1.49.1
          build/zai013-browser/node_modules/.bin/playwright install --with-deps chromium
          PIANO_PLAYWRIGHT="$PWD/build/zai013-browser/node_modules/playwright" \
            node tests/CreationResponsiveLayoutBrowserTest.js
          PIANO_PLAYWRIGHT="$PWD/build/zai013-browser/node_modules/playwright" \
            node tests/CreationScoreLastStaffBrowserTest.js
