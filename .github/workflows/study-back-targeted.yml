name: 0.9.61 focused Study navigation (temporary)
on:
  push:
    branches: [ci/0.9.61-study-back-targeted]
permissions:
  contents: read
jobs:
  study-back-phone-tablet:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    defaults:
      run:
        working-directory: PianoLivreAndroid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build exact checkout debug APK (no signing secrets)
        run: gradle --no-daemon :app:assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_3
          disable-animations: true
          working-directory: PianoLivreAndroid
          script: |
            adb shell svc wifi disable
            adb shell svc data disable
            adb install app/build/outputs/apk/debug/app-debug.apk
            python3 tests/emulator_study_back_focused.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: study-back-phone-tablet-evidence
          path: PianoLivreAndroid/study-back-*.png
          retention-days: 7
          if-no-files-found: warn
