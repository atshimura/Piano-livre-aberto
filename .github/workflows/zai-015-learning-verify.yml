name: Piano Livre ZAi - ZAI-015 Aprender notas, acordes e leitura
on:
  push:
    branches:
      - zai/feat/zai015-aprender-pratica-leitura-20261112
  pull_request:
    branches:
      - zai/lab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  musica-e-apk-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: PianoLivreAndroid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Instalar Android SDK 36
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Motor musical e MusicXML JVM
        run: |
          set -euo pipefail
          mkdir -p build/zai015-jvm
          javac -encoding UTF-8 -d build/zai015-jvm \
            app/src/main/java/br/org/pianolivre/MusicTheory.java \
            app/src/main/java/br/org/pianolivre/MusicLabCatalog.java \
            app/src/main/java/br/org/pianolivre/DiscoveryScoreBuilder.java \
            app/src/main/java/br/org/pianolivre/MusicLearningEngine.java \
            app/src/main/java/br/org/pianolivre/MusicLearningScore.java \
            tests/MusicLearningEngineTest.java
          java -cp build/zai015-jvm br.org.pianolivre.MusicLearningEngineTest
      - name: Contratos de UI e preservação das etapas anteriores
        run: |
          set -euo pipefail
          python3 scripts/verify_public_snapshot.py
          python3 tests/test_zai015_learning_contract.py
          python3 tests/test_zai010_dashboard_contract.py
          python3 tests/test_zai011_vertical_layout_contract.py
          python3 tests/test_zai012_content_viewport_contract.py
          python3 tests/test_zai013_score_preview_contract.py
          python3 tests/test_zai014_unified_toolbar_contract.py
          python3 tests/test_creation_responsive_contract.py
          python3 tests/test_creation_library_contract.py
          python3 tests/test_creation_score_deletion_contract.py
      - name: Compilar aplicativo Android debug, pacote técnico isolado
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug -Ppianolivre.zai.test=true
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk > build/zai015-debug-metadata.txt
          grep -Fq "package: name='br.org.pianolivre.opensource.zai'" build/zai015-debug-metadata.txt
          echo ZAI015_ANDROID_DEBUG_BUILD_PASS
      - name: Renderização do OSMD local em Chromium
        run: |
          set -euo pipefail
          npm install --prefix build/zai015-browser --no-audit --no-fund playwright@1.49.1
          build/zai015-browser/node_modules/.bin/playwright install --with-deps chromium
          PIANO_PLAYWRIGHT="$PWD/build/zai015-browser/node_modules/playwright" \
            node tests/CreationResponsiveLayoutBrowserTest.js
          PIANO_PLAYWRIGHT="$PWD/build/zai015-browser/node_modules/playwright" \
            node tests/CreationScoreLastStaffBrowserTest.js
      - name: Salvar APK isolado para smoke Android
        uses: actions/upload-artifact@v4
        with:
          name: ZAI015-debug-${{ github.sha }}
          path: PianoLivreAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  android-gui:
    needs: musica-e-apk-debug
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ZAI015-debug-${{ github.sha }}
          path: PianoLivreAndroid/app/build/outputs/apk/debug/
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_3
          disable-animations: true
          working-directory: PianoLivreAndroid
          script: |
            adb shell svc wifi disable
            adb shell svc data disable
            adb install app/build/outputs/apk/debug/app-debug.apk
            python3 tests/emulator_zai015_learning.py
      - name: Arquivar capturas e relatório mesmo em falha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZAI015-android-evidence-${{ github.sha }}
          path: |
            PianoLivreAndroid/zai015-*.png
            PianoLivreAndroid/zai015-android-report.json
            PianoLivreAndroid/window.xml
          if-no-files-found: warn
          retention-days: 14
