# ZAI-001: artefato de validacao EXCLUSIVO da linha ZAi, sem releases.
# Nao executa na main, nao publica tags e usa a assinatura publica permanente
# configurada exclusivamente em GitHub Actions Secrets.
name: Piano Livre ZAi - APK de teste assinado

on:
  push:
    branches:
      - zai/lab
    paths:
      - '.github/workflows/zai-apk-teste.yml'
      - 'PianoLivreAndroid/**'
      - 'ZAI-CONTINUIDADE.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zai-apk-teste-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gerar-apk:
    if: github.ref == 'refs/heads/zai/lab'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    defaults:
      run:
        working-directory: PianoLivreAndroid
    steps:
      - name: Checkout da branch ZAi
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Preparar Android SDK 36
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'

      - name: Auditoria da copia publica e contratos dirigidos
        run: |
          set -euo pipefail
          python3 scripts/verify_public_snapshot.py
          python3 tests/test_creation_responsive_contract.py
          python3 tests/test_creation_score_deletion_contract.py
          python3 tests/test_creation_library_contract.py
          python3 tests/test_impl4_osmd_contract.py
          python3 tests/test_workflow_contract_audit.py

      - name: Testes do novo motor ZAI-001 na JVM
        run: |
          set -euo pipefail
          mkdir -p build/zai-test-jvm
          javac -encoding UTF-8 -d build/zai-test-jvm \
            app/src/main/java/br/org/pianolivre/MidiTakeRecorder.java \
            app/src/main/java/br/org/pianolivre/ScoreMidiPairer.java \
            app/src/main/java/br/org/pianolivre/ScoreTempoEstimator.java \
            app/src/main/java/br/org/pianolivre/ScoreRhythmQuantizer.java \
            app/src/main/java/br/org/pianolivre/ScoreXmlComposer.java \
            app/src/main/java/br/org/pianolivre/CreationScoreGenerator.java \
            app/src/main/java/br/org/pianolivre/CreationProjectStore.java \
            app/src/main/java/br/org/pianolivre/CreationScoreStore.java \
            app/src/main/java/br/org/pianolivre/SessionFiles.java \
            app/src/main/java/br/org/pianolivre/Score.java \
            tests/ZScoreGeneratorRhythmTest.java \
            tests/ZScoreGeneratorXmlTest.java \
            tests/CreationScoreStoreTest.java \
            tests/CreationC2DCorpusTest.java \
            tests/ZScoreRealMidiRegressionTest.java
          java -cp build/zai-test-jvm br.org.pianolivre.ZScoreGeneratorRhythmTest
          java -cp build/zai-test-jvm br.org.pianolivre.ZScoreGeneratorXmlTest
          java -cp build/zai-test-jvm br.org.pianolivre.CreationScoreStoreTest
          java -cp build/zai-test-jvm br.org.pianolivre.CreationC2DCorpusTest
          java -cp build/zai-test-jvm br.org.pianolivre.ZScoreRealMidiRegressionTest

      - name: Configurar chave publica permanente
        env:
          PUBLIC_KEYSTORE_B64: ${{ secrets.PIANOLIVRE_PUBLIC_KEYSTORE_BASE64 }}
          PUBLIC_STORE_PASSWORD: ${{ secrets.PIANOLIVRE_PUBLIC_STORE_PASSWORD }}
          PUBLIC_KEY_ALIAS: ${{ secrets.PIANOLIVRE_PUBLIC_KEY_ALIAS }}
          PUBLIC_KEY_PASSWORD: ${{ secrets.PIANOLIVRE_PUBLIC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$PUBLIC_KEYSTORE_B64" || -z "$PUBLIC_STORE_PASSWORD" || -z "$PUBLIC_KEY_ALIAS" || -z "$PUBLIC_KEY_PASSWORD" ]]; then
            echo "::error::Assinatura permanente indisponivel. O APK nao sera distribuido com chave temporaria."
            exit 1
          fi
          keypath="$RUNNER_TEMP/pianolivre-zai-public.jks"
          printf '%s' "$PUBLIC_KEYSTORE_B64" | base64 --decode > "$keypath"
          chmod 600 "$keypath"
          echo "PIANOLIVRE_PUBLIC_KEYSTORE_FILE=$keypath" >> "$GITHUB_ENV"
          echo "ASSINATURA_PERMANENTE_CONFIGURADA"

      - name: Compilar APK release assinado para teste da ZAi
        env:
          PIANOLIVRE_PUBLIC_STORE_PASSWORD: ${{ secrets.PIANOLIVRE_PUBLIC_STORE_PASSWORD }}
          PIANOLIVRE_PUBLIC_KEY_ALIAS: ${{ secrets.PIANOLIVRE_PUBLIC_KEY_ALIAS }}
          PIANOLIVRE_PUBLIC_KEY_PASSWORD: ${{ secrets.PIANOLIVRE_PUBLIC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleRelease -Ppianolivre.zai.test=true

      - name: Verificar APK, identidade, assinatura e integridade
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          mkdir -p build
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" > build/zai-signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > build/zai-metadata.txt
          grep -Fq 'Signer #1 certificate SHA-256 digest: 7bf1e9fa2d6cf1468463a2990e0a0699acc7c5efac45a77070c4d084e7798290' build/zai-signature.txt
          grep -Fq "package: name='br.org.pianolivre.opensource.zai'" build/zai-metadata.txt
          grep -Fq "application-label:'Piano Livre ZAi'" build/zai-metadata.txt
          grep -Fq "versionCode='73'" build/zai-metadata.txt
          grep -Fq "versionName='0.9.64-open-beta'" build/zai-metadata.txt
          if grep -Fq 'android.permission.INTERNET' build/zai-metadata.txt; then
            echo "::error::APK recebeu permissao INTERNET"
            exit 1
          fi
          if grep -Fq 'application-debuggable' build/zai-metadata.txt; then
            echo "::error::APK nao pode ser depuravel"
            exit 1
          fi
          {
            echo "Piano Livre ZAi - APK de teste (nao e Release)"
            echo "commit=${GITHUB_SHA}"
            echo "branch=${GITHUB_REF_NAME}"
            sha256sum "$apk"
            grep 'Signer #1 certificate SHA-256 digest:' build/zai-signature.txt
            grep '^package:' build/zai-metadata.txt
            grep '^sdkVersion:' build/zai-metadata.txt
            grep '^targetSdkVersion:' build/zai-metadata.txt
          } > build/zai-apk-comprovante.txt
          cat build/zai-apk-comprovante.txt

      - name: Publicar artefato temporario de teste da ZAi
        uses: actions/upload-artifact@v4
        with:
          name: PianoLivre-ZAi-APK-teste-${{ github.sha }}
          path: |
            PianoLivreAndroid/app/build/outputs/apk/release/app-release.apk
            PianoLivreAndroid/build/zai-apk-comprovante.txt
            PianoLivreAndroid/build/zai-signature.txt
            PianoLivreAndroid/build/zai-metadata.txt
          if-no-files-found: error
          retention-days: 30
